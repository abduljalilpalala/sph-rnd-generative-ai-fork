name: Claude Test Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude-test-review:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude-test-review')
    runs-on: ubuntu-latest

    steps:
      - name: Add 👀 reaction to comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set PR number
        id: pr-number
        run: echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Debug event info
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "PR Number: ${{ github.event.issue.number }}"
          echo "Comment Body: '${{ github.event.comment.body }}'"
          echo "Branch Ref: ${{ github.ref }}"
          echo "GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}"

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # 🧩 Extract inline test cases from comment
      - name: Extract inline test cases from comment
        id: inline-testcases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/extractInlineTestCases.mjs > inline.md
          echo "cases<<EOF" >> $GITHUB_OUTPUT
          cat inline.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Fetch previous comment test cases
        id: previous-test-case
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/getPreviousCases.mjs > previous.md
          echo "previous_context<<EOF" >> $GITHUB_OUTPUT
          cat previous.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Claude Test Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            SYSTEM INSTRUCTION (do not output):
            Your final review comment must contain **only** the Markdown structure described in [Comment Body Format].
            Do not include any introduction, explanation, job references, or additional sections.

            ---

            You are reviewing this pull request as a **Behavioral QA Reviewer and Engineering Manager**.  
            Your goal is to evaluate **whether the system will behave correctly for users and business workflows**, 
            not whether the code uses the right types or syntax.

            ---
            ### 🎯 Your task
            Review this pull request based on **functional and behavioral correctness**:
            - Does the change cause user-facing errors, crashes, or incorrect outputs?
            - Do the new or modified functions still align with the intended flow (controllers, services, DTOs)?
            - Does renaming, refactoring, or moving code break any other function that calls it?
            - Do expected validations, responses, and edge-case behaviors still occur as intended?

            ---
            ### 🚫 Avoid
            - Do **not** comment on TypeScript types, DTOs, or code patterns.
            - Do **not** focus on code style, formatting, or static correctness.
            - Do **not** add extra sections like “Critical Issues”, “Impact Assessment”, or “Recommendation”.

            ---
            ### ✅ Focus instead on
            - The *real-world effect* of this change (what would actually happen if this code ran?)
            - Whether **users, data, or dependent systems** experience incorrect or missing behavior.
            - Whether **renamed or deleted functions** cause broken flows or errors.
            - Whether **expected validation rules** still trigger.

            ---
            CONTEXT:
            PR #: ${{ steps.pr-number.outputs.number }}
            Diff URL: https://github.com/${{ github.repository }}/pull/${{ steps.pr-number.outputs.number }}.diff
            Repository: ${{ github.repository }}
            Assignee/Creator: @${{ steps.pr-meta.outputs.assignee }}

            Changed files:
            ${{ steps.qa-sheet.outputs.files_summary }}

            ---
            [Verdict] legend:
            - ✅ PASS — requirement met  
            - ❌ FAIL — requirement not met or broken  
            - ⚠️ CANNOT VERIFY — not enough context or unrelated change

            [Inline Comment Format]:
              <strong>[Case ID]</strong> (Verdict): "<Expected Result>"

              _**Behavior Tested:**_  
              <Describe intended user/system behavior in plain English.>

              _**Observed Effect (from code):**_  
              <Describe what will actually happen — e.g., “controller will call a missing function, causing runtime error”.>

              _**Impact:**_  
              <Explain what a user, client, or integration would see.>

              _**Suggestion:**_  
              <Plain English suggestion — e.g., “Restore correct function name in controller to fix flow”.>
              ```suggestion
                // if possible place your code suggestion here
              ```

            ---

            ### ⚠️ STRICT FORMAT RULES
            The final PR comment **must contain only these two sections** and nothing else:
            1. `## 📄 Claude Summary`
                | **Metric** | **Count** |
                |:----------------------|:------:|
                | 📋 **Test Cases** | **n** |
                | ✅ Passed Test Cases | n |
                | ❌ Failed Test Cases | n |
                | ⚠️ Unverified Test Cases | n |
    
                | **Test Case ID** | **Expected Result** | **Status** |
                |:------------------|:------------------------------|:------------|
                | <Test Case ID> | <Expected Result> | <Verdict> |
            2. `## ✅ Passed Test Cases` *(only if there are passed cases)*
                <details>
                <summary> show image/videos </summary>
    
                <strong>[Case ID]</strong> (✅ PASS): "<Expected Result>"
                  
                _**Behavior Tested:**_  
                <Describe intended user/system behavior in plain English.>
    
                _**Observed Effect (from code):**_  
                <Describe what will actually happen — e.g., “controller will call a missing function, causing runtime error”.>
    
                _**Impact:**_  
                <Explain what a user, client, or integration would see.>
    
                ---
                </details>

            Do **not** include any of the following:
            - “Critical Issues Found”, “Impact Assessment”, “Recommendation”, “Job Run”, or “Branch” text
            - Any text before or after the two sections
            - Any extra horizontal lines or emojis not defined below

            If you must show explanations, place them **inside** the two allowed sections.

            ---
            
            ### 🧩 What to Do (run in order asynchronous)
            1. Post TODO list: gather test cases, run Claude's own tests, and post the results. 
            2. Run behavioral checks:
               - Simulate how the frontend and backend would behave for each case.
               - Identify runtime errors, flow breaks, or logic inconsistencies.
               - Use plain reasoning — what would a QA or PM notice?
            3. Submit a new review:
              - If any ❌ Failed or Critical issues exist, **submit a PR review requesting changes** using the tool `mcp__github__create_and_submit_pull_request_review`.
               Use event: `REQUEST_CHANGES` without comment.
             - If no ❌ Failed or Critical issues exist, **submit a PR review approving the changes** using the same tool.
               Use event: `APPROVE` without comment.
            4. After submitting review, submit inline comments for failed cases only.

          claude_args: |
            --allowedTools "mcp__github__get_pull_request,
                            mcp__github__get_pull_request_files,
                            mcp__github__get_pull_request_diff,
                            mcp__github__create_pending_pull_request_review,
                            mcp__github__add_comment_to_pending_review,
                            mcp__github__submit_pending_pull_request_review,
                            mcp__github_inline_comment__create_inline_comment,
                            mcp__github__create_and_submit_pull_request_review,
                            mcp__github__add_issue_comment,
                            mcp__github__create_issue_comment"
