name: Framework Agnostic Claude Unit Test Generator v1.1

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

jobs:
  generate-unit-tests:
    if: |
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude-create-unit-test')) ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'claude-create-unit-test')

    runs-on: [self-hosted, claude-code-review]

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Add eye reaction to acknowledge comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Get PR number
        id: pr-info
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Post initial comment
        id: initial-comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr-info.outputs.number }},
              body: '🔄 Generating unit tests for this PR... This may take a few minutes.'
            });
            core.setOutput('comment_id', comment.id);

      - name: Detect Framework and Load Instructions
        id: load-instructions
        run: |
          TEMPLATE_REPO="https://raw.githubusercontent.com/ragg09-sunasterisk/rnd-unit-test-templates/main"
          INSTRUCTIONS=""
          FRAMEWORK="unknown"
          USE_CLAUDE_MD=false
          FRAMEWORK_SOURCE="none"

          echo "📋 Checking for project guidance files..."

          # Step 1: Check for claude.md and extract framework
          if [ -f "claude.md" ]; then
            echo "✓ Found claude.md in project"
            EXTRACTED_FRAMEWORK=$(grep -iE "framework:\s*(\w+)|this is a (\w+) (project|application|app)|(\w+)\s*\+\s*prisma|(\w+)\s*backend|(\w+)\s*frontend|using\s+(\w+)|(\w+)\s*\+" claude.md | grep -oiE "(nestjs|nextjs|next\.js|next|react|express|laravel|rails|vue|django|flask|fastapi|angular|svelte|remix|astro|solid|qwik|nuxt|fastify|koa|symfony|sinatra|gin|echo|spring-boot|springboot)" | head -1 | tr '[:upper:]' '[:lower:]' | sed 's/next\.js/nextjs/g' | sed 's/^next$/nextjs/' || echo "")

            if [ -n "$EXTRACTED_FRAMEWORK" ]; then
              FRAMEWORK="$EXTRACTED_FRAMEWORK"
              FRAMEWORK_SOURCE="claude.md"
              echo "✓ Extracted framework from claude.md: $FRAMEWORK"
            fi

            if grep -qiE "unit.*test|test.*instruction|testing.*guide|## test" claude.md; then
              echo "✓ Found unit test instructions section in claude.md"
              INSTRUCTIONS=$(cat claude.md)
              USE_CLAUDE_MD=true
              FRAMEWORK_SOURCE="claude.md (with test instructions)"
            else
              echo "→ claude.md found but no dedicated test instructions section"
              echo "→ Will fetch test instructions from template repo for framework: $FRAMEWORK"
            fi
          fi

          # Step 2: Auto-detect framework if unknown
          if [ "$FRAMEWORK" = "unknown" ]; then
            echo "📦 Auto-detecting framework from project structure..."
            if [ -f "nest-cli.json" ] || grep -q "@nestjs/core" package.json 2>/dev/null; then
              FRAMEWORK="nestjs"
              FRAMEWORK_SOURCE="auto-detection"
            elif grep -q "\"next\":" package.json 2>/dev/null || [ -f "next.config.js" ]; then
              FRAMEWORK="nextjs"
              FRAMEWORK_SOURCE="auto-detection"
            elif [ -f "artisan" ] && grep -q "laravel/framework" composer.json 2>/dev/null; then
              FRAMEWORK="laravel"
              FRAMEWORK_SOURCE="auto-detection"
            else
              FRAMEWORK="generic"
              FRAMEWORK_SOURCE="fallback"
            fi
            echo "✓ Framework detected: $FRAMEWORK"
          fi

          # Step 3: Fetch test instructions
          if [ -z "$INSTRUCTIONS" ]; then
            echo "📥 Fetching test instructions for '$FRAMEWORK'..."
            INSTRUCTIONS_URL="$TEMPLATE_REPO/$FRAMEWORK/instructions.md"
            HTTP_CODE=$(curl -s -o /tmp/fetched-instructions.txt -w "%{http_code}" "$INSTRUCTIONS_URL")

            if [ "$HTTP_CODE" = "200" ]; then
              INSTRUCTIONS=$(cat /tmp/fetched-instructions.txt)
              echo "✓ Loaded framework instructions"
            else
              echo "⚠ Could not fetch instructions (HTTP $HTTP_CODE)"
              INSTRUCTIONS="Generate comprehensive unit tests following the project's conventions."
            fi
          fi

          echo "$INSTRUCTIONS" > /tmp/test-instructions.txt
          echo "framework=$FRAMEWORK" >> $GITHUB_OUTPUT
          echo "use_claude_md=$USE_CLAUDE_MD" >> $GITHUB_OUTPUT
          echo "framework_source=$FRAMEWORK_SOURCE" >> $GITHUB_OUTPUT

      - name: Create branch for unit tests
        id: create-branch
        run: |
          BRANCH_NAME="unit-tests/pr-${{ steps.pr-info.outputs.number }}-$(date +%s)"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          git checkout -b "$BRANCH_NAME"

      - name: Generate Unit Tests with Claude
        id: claude-tests
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          prompt: |
            Generate comprehensive unit tests for PR #${{ steps.pr-info.outputs.number }}.

            **Framework:** ${{ steps.load-instructions.outputs.framework }}
            **Source:** ${{ steps.load-instructions.outputs.framework_source }}

            ## Testing Instructions
            $(cat /tmp/test-instructions.txt)

            Follow framework-specific test conventions and ensure full coverage.

          claude_args: '--allowed-tools "Bash(gh pr diff:*),Bash(cat:*),Bash(find:*),Bash(grep:*)" --dangerously-skip-permissions'

      - name: Push branch and create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "Add unit tests for PR #${{ steps.pr-info.outputs.number }}" || true
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ steps.create-branch.outputs.branch }}

            PR_URL=$(gh pr create \
              --title "Unit Tests for PR #${{ steps.pr-info.outputs.number }}" \
              --body "This PR adds unit tests for the changes in #${{ steps.pr-info.outputs.number }}.

            **Framework:** ${{ steps.load-instructions.outputs.framework }}
            **Detection:** ${{ steps.load-instructions.outputs.framework_source }}

            Generated by Claude Code in response to @claude-create-unit-test comment." \
              --base ${{ github.event.repository.default_branch }} \
              --head ${{ steps.create-branch.outputs.branch }})

            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/issues/comments/${{ steps.initial-comment.outputs.comment_id }}" \
              -f body="✅ Unit tests have been generated and submitted in a new PR: $PR_URL"
          else
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/issues/comments/${{ steps.initial-comment.outputs.comment_id }}" \
              -f body="⚠️ No unit test files were generated. Please check if testable code exists or if claude.md needs update."
          fi

      - name: Add completion reaction
        if: success() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Add failure reaction
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'confused'
            });
