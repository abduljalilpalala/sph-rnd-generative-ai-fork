name: Claude Unified Unit Test Generator v4 (Cost Optimized)

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

jobs:
  generate-unit-tests:
    if: |
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude-create-unit-test')) ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'claude-create-unit-test')

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Add eye reaction to acknowledge comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Get PR number
        id: pr-info
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Get PR branch info
        id: pr-branch
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ steps.pr-info.outputs.number }}
            });

            core.setOutput('head_branch', pr.data.head.ref);
            core.setOutput('base_branch', pr.data.base.ref);
            return pr.data;

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Post initial comment
        id: initial-comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr-info.outputs.number }},
              body: '🔄 Analyzing PR changes and generating unit tests... This may take a few minutes.'
            });
            core.setOutput('comment_id', comment.id);
            return comment.id;

      - name: Detect changes and determine docs to read
        id: detect-changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Analyzing PR changes ==="

          # Get changed files
          CHANGED_FILES=$(gh pr diff ${{ steps.pr-info.outputs.number }} --name-only)
          echo "$CHANGED_FILES"

          # Detect backend changes (excluding DTOs, entities, modules)
          BE_CHANGES=$(echo "$CHANGED_FILES" | grep -E "test-projects/test-backend/src/.*\.(controller|service)\.ts$" | grep -v node_modules || echo "")

          # Detect frontend changes (excluding pages and configs)
          FE_CHANGES=$(echo "$CHANGED_FILES" | grep -E "test-projects/test-frontend/(components|hooks|lib)/.*\.(tsx?|ts)$" | grep -v -E "(node_modules|\.config\.|\.d\.ts|app/)" || echo "")

          # Set flags for what to process
          if [ -n "$BE_CHANGES" ]; then
            echo "has_be=true" >> $GITHUB_OUTPUT
            echo "✅ Backend changes detected"
          else
            echo "has_be=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No backend changes requiring tests"
          fi

          if [ -n "$FE_CHANGES" ]; then
            echo "has_fe=true" >> $GITHUB_OUTPUT
            echo "✅ Frontend changes detected"
          else
            echo "has_fe=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No frontend changes requiring tests"
          fi

          # Save file lists for Claude
          echo "$BE_CHANGES" > /tmp/be_files.txt
          echo "$FE_CHANGES" > /tmp/fe_files.txt

      - name: Create branch for unit tests
        id: create-branch
        if: steps.detect-changes.outputs.has_be == 'true' || steps.detect-changes.outputs.has_fe == 'true'
        run: |
          PR_BRANCH="${{ steps.pr-branch.outputs.head_branch }}"
          BRANCH_NAME="${PR_BRANCH}-unit-test"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git --delete "$BRANCH_NAME" 2>/dev/null || echo "Branch doesn't exist remotely"
          git checkout -b "$BRANCH_NAME"

      - name: Generate Unit Tests with Claude
        id: claude-tests
        if: steps.detect-changes.outputs.has_be == 'true' || steps.detect-changes.outputs.has_fe == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_UNIT_TEST }}
          additional_permissions: |
            actions: read
          prompt: |
            Generate unit tests for PR #${{ steps.pr-info.outputs.number }}.

            FILES TO TEST:
            ${{ steps.detect-changes.outputs.has_be == 'true' && 'Backend (controllers/services):' || '' }}
            ${{ steps.detect-changes.outputs.has_be == 'true' && '```bash' || '' }}
            ${{ steps.detect-changes.outputs.has_be == 'true' && 'cat /tmp/be_files.txt' || '' }}
            ${{ steps.detect-changes.outputs.has_be == 'true' && '```' || '' }}

            ${{ steps.detect-changes.outputs.has_fe == 'true' && 'Frontend (components/hooks):' || '' }}
            ${{ steps.detect-changes.outputs.has_fe == 'true' && '```bash' || '' }}
            ${{ steps.detect-changes.outputs.has_fe == 'true' && 'cat /tmp/fe_files.txt' || '' }}
            ${{ steps.detect-changes.outputs.has_fe == 'true' && '```' || '' }}

            INSTRUCTIONS:
            1. Read relevant docs:
            ${{ steps.detect-changes.outputs.has_be == 'true' && '   - `cat CLAUDE-BE.md` (focus on Unit Testing Guidelines)' || '' }}
            ${{ steps.detect-changes.outputs.has_fe == 'true' && '   - `cat CLAUDE-FE.md` (focus on Unit Testing Guidelines)' || '' }}

            2. For each file above, create a test file in the SAME directory:
               - Backend: .controller.ts → .controller.spec.ts, .service.ts → .service.spec.ts
               - Frontend: .tsx → .test.tsx, use*.ts → .test.ts

            3. Follow patterns from docs. Mock dependencies. Cover success/error cases.

            RULES:
            - Create tests ONLY in test-projects/ (never node_modules/)
            - Use naming: .spec.ts (backend) or .test.ts/.test.tsx (frontend)
            - Don't create markdown files or commit

            Keep tests concise but comprehensive.
          claude_args: '--allowed-tools "Bash(cat:*),Bash(ls:*),Bash(find:test-projects*)" --dangerously-skip-permissions'

      - name: Debug - Check test files
        if: always()
        run: |
          echo "=== Backend tests ==="
          find test-projects/test-backend/src -name "*.spec.ts" -not -path "*/node_modules/*" 2>/dev/null || echo "None"

          echo -e "\n=== Frontend tests ==="
          find test-projects/test-frontend -name "*.test.ts*" -not -path "*/node_modules/*" -not -path "*/app/*" 2>/dev/null || echo "None"

      - name: Clean up node_modules
        run: |
          find test-projects -type f \( -name "*.spec.ts" -o -name "*.test.ts*" \) -path "*/node_modules/*" -delete 2>/dev/null || true

      - name: Check for test files and commit
        id: commit-tests
        continue-on-error: true
        run: |
          BACKEND_TESTS=$(find test-projects/test-backend/src -type f -name "*.spec.ts" -not -path "*/node_modules/*" 2>/dev/null || echo "")
          FRONTEND_TESTS=$(find test-projects/test-frontend -type f \( -name "*.test.ts" -o -name "*.test.tsx" \) -not -path "*/node_modules/*" -not -path "*/app/*" 2>/dev/null || echo "")

          ALL_TESTS="${BACKEND_TESTS}${FRONTEND_TESTS}"

          if [ -z "$ALL_TESTS" ]; then
            echo "tests_found=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "tests_found=true" >> $GITHUB_OUTPUT

          # Add and commit
          [ -n "$BACKEND_TESTS" ] && find test-projects/test-backend/src -name "*.spec.ts" -not -path "*/node_modules/*" -exec git add -f {} \;
          [ -n "$FRONTEND_TESTS" ] && find test-projects/test-frontend \( -name "*.test.ts" -o -name "*.test.tsx" \) -not -path "*/node_modules/*" -not -path "*/app/*" -exec git add -f {} \;

          git commit -m "Add unit tests for ${{ steps.pr-branch.outputs.head_branch }}" || echo "Nothing to commit"

      - name: Push and update comment (Success)
        if: steps.commit-tests.outputs.tests_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 2>/dev/null | grep -E "\.(spec\.ts|test\.ts|test\.tsx)$" || echo "")

          [ -z "$CHANGED_FILES" ] && exit 1

          BACKEND_COUNT=$(echo "$CHANGED_FILES" | grep "\.spec\.ts$" | wc -l)
          FRONTEND_COUNT=$(echo "$CHANGED_FILES" | grep -E "\.(test\.ts|test\.tsx)$" | wc -l)

          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ steps.create-branch.outputs.branch }}

          REPO_URL="https://github.com/${{ github.repository }}"
          BRANCH_NAME="${{ steps.create-branch.outputs.branch }}"
          PR_HEAD_BRANCH="${{ steps.pr-branch.outputs.head_branch }}"
          PR_CREATE_URL="$REPO_URL/compare/$PR_HEAD_BRANCH...$BRANCH_NAME?expand=1"

          SUMMARY=""
          [ "$BACKEND_COUNT" -gt 0 ] && SUMMARY="${SUMMARY}\n- **Backend**: $BACKEND_COUNT test file(s)"
          [ "$FRONTEND_COUNT" -gt 0 ] && SUMMARY="${SUMMARY}\n- **Frontend**: $FRONTEND_COUNT test file(s)"

          gh api --method PATCH -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/comments/${{ steps.initial-comment.outputs.comment_id }}" \
            -f body="✅ Unit tests generated and pushed to \`$BRANCH_NAME\`

          **Tests generated:**$SUMMARY

          **Next:** [Create PR]($PR_CREATE_URL) or checkout locally:
          \`\`\`bash
          git fetch origin && git checkout $BRANCH_NAME
          \`\`\`

          <details><summary>📋 Files</summary>

          \`\`\`
          $CHANGED_FILES
          \`\`\`
          </details>"

      - name: Update comment (No tests)
        if: steps.detect-changes.outputs.has_be != 'true' && steps.detect-changes.outputs.has_fe != 'true' || steps.commit-tests.outputs.tests_found != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/comments/${{ steps.initial-comment.outputs.comment_id }}" \
            -f body="⚠️ No unit tests generated.

          **Reason:** Only DTOs, entities, modules, configs, or pages changed.

          We don't test: DTOs (.dto.ts), entities (.entity.ts), modules (.module.ts), configs, pages (app/)"

      - name: Add reactions
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const reaction = '${{ steps.commit-tests.outputs.tests_found }}' === 'true' ? 'rocket' : 'eyes';
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: reaction
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr-info.outputs.number }},
              body: '❌ Workflow failed. [View logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            });
