name: Claude Unified Unit Test Generator

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

jobs:
  generate-unit-tests:
    if: |
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude-create-unit-test')) ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'claude-create-unit-test')

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Add eye reaction to acknowledge comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Get PR number
        id: pr-info
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Get PR branch info
        id: pr-branch
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ steps.pr-info.outputs.number }}
            });

            core.setOutput('head_branch', pr.data.head.ref);
            core.setOutput('base_branch', pr.data.base.ref);
            return pr.data;

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Post initial comment
        id: initial-comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr-info.outputs.number }},
              body: '🔄 Analyzing PR changes and generating unit tests... This may take a few minutes.'
            });
            core.setOutput('comment_id', comment.id);
            return comment.id;

      - name: Create branch for unit tests
        id: create-branch
        run: |
          PR_BRANCH="${{ steps.pr-branch.outputs.head_branch }}"
          BRANCH_NAME="${PR_BRANCH}-unit-test"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

          # Delete the remote branch if it exists
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git --delete "$BRANCH_NAME" 2>/dev/null || echo "Branch doesn't exist remotely, continuing..."

          # Create and checkout the new branch
          git checkout -b "$BRANCH_NAME"

      - name: Generate Unit Tests with Claude
        id: claude-tests
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_UNIT_TEST }}
          additional_permissions: |
            actions: read
          prompt: |
            You are tasked with generating comprehensive unit tests for PR #${{ steps.pr-info.outputs.number }}.

            ## CRITICAL: Follow This Process

            ### Step 1: Read Project Documentation

            **MANDATORY**: Read these files in order to understand the project structure and testing requirements:

            1. First, read `CLAUDE.md` to understand:
               - Overall project structure (monorepo layout)
               - Which sub-projects exist (backend/frontend)
               - High-level organization

            2. Run: `gh pr diff ${{ steps.pr-info.outputs.number }}` to see what files changed

            3. Based on which files changed, read the appropriate documentation:
               - If backend files changed (`test-projects/test-backend/**`): Read `CLAUDE-BE.md`
               - If frontend files changed (`test-projects/test-frontend/**`): Read `CLAUDE-FE.md`
               - If both changed: Read both files

            These documentation files contain ALL the information you need:
            - Project architecture and folder structure
            - Testing frameworks and patterns
            - File naming conventions (`.spec.ts` vs `.test.ts`/`.test.tsx`)
            - What files need tests and where to place them
            - Specific testing examples and best practices
            - Mocking patterns and common utilities

            ### Step 2: Analyze What Changed

            Review the PR diff you fetched earlier and identify:
            - Backend files that need tests (controllers, services)
            - Frontend files that need tests (components, hooks, utilities)
            - Which specific testing patterns apply from the docs

            ### Step 3: Generate Tests

            For each testable file in the PR diff:

            **Backend Files** (if CLAUDE-BE.md was read):
            - `.controller.ts` → create `.controller.spec.ts` in same directory
            - `.service.ts` → create `.service.spec.ts` in same directory
            - Follow NestJS + Jest patterns from CLAUDE-BE.md
            - Mock PrismaService and dependencies
            - Test all public methods, success/error/edge cases

            **Frontend Files** (if CLAUDE-FE.md was read):
            - Component `.tsx` → create `.test.tsx` in same directory
            - Hook `use*.ts` → create `.test.ts` in same directory
            - Utility `.ts` → create `.test.ts` in same directory
            - Follow React Testing Library patterns from CLAUDE-FE.md
            - Mock Next.js router, RTK Query, and API calls
            - Test rendering, interactions, and behavior

            ## Critical Rules

            - ✅ **DO**: Create test files in the SAME directory as source files
            - ✅ **DO**: Follow naming conventions from the docs (.spec.ts vs .test.ts/.test.tsx)
            - ✅ **DO**: Include all necessary imports and mocks
            - ✅ **DO**: Write descriptive test names
            - ✅ **DO**: Cover success, error, and edge cases
            - ✅ **DO**: Follow the exact patterns shown in CLAUDE-BE.md and CLAUDE-FE.md

            - ❌ **DO NOT**: Create output.txt or summary files
            - ❌ **DO NOT**: Create any markdown files or documentation
            - ❌ **DO NOT**: Commit files (just create them)
            - ❌ **DO NOT**: Skip reading the documentation files
            - ❌ **DO NOT**: Make up your own testing patterns - use the docs

            ## Example Workflow

            ```bash
            # 1. Read documentation
            cat CLAUDE.md
            gh pr diff ${{ steps.pr-info.outputs.number }}
            cat CLAUDE-BE.md  # if backend changes
            cat CLAUDE-FE.md  # if frontend changes

            # 2. Create test files based on what you learned
            # Follow the exact patterns from the documentation
            ```

            Remember: The documentation files (CLAUDE-BE.md and CLAUDE-FE.md) are your source of truth. 
            They contain all the patterns, examples, and requirements you need. Read them carefully!
          claude_args: '--allowed-tools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(cat:*),Bash(ls:*),Bash(find:*),Bash(grep:*)" --dangerously-skip-permissions'

      - name: Debug - Check what Claude created
        run: |
          echo "=== Workspace contents ==="
          ls -la

          echo -e "\n=== Backend test files ==="
          find test-projects/test-backend -name "*.spec.ts" -type f 2>/dev/null || echo "No backend test files found"

          echo -e "\n=== Frontend test files ==="
          find test-projects/test-frontend -name "*.test.ts" -o -name "*.test.tsx" -type f 2>/dev/null || echo "No frontend test files found"

          echo -e "\n=== Git status ==="
          git status

          echo -e "\n=== Untracked files ==="
          git ls-files --others --exclude-standard

      - name: Check for test files and commit
        run: |
          echo "=== Checking for test files ==="

          # Find all test files (both backend and frontend)
          BACKEND_TESTS=$(find test-projects/test-backend -name "*.spec.ts" -type f 2>/dev/null || echo "")
          FRONTEND_TESTS=$(find test-projects/test-frontend \( -name "*.test.ts" -o -name "*.test.tsx" \) -type f 2>/dev/null || echo "")

          ALL_TESTS="${BACKEND_TESTS}${FRONTEND_TESTS}"

          if [ -z "$ALL_TESTS" ]; then
            echo "No test files found"
            exit 1
          fi

          echo "Found test files:"
          [ -n "$BACKEND_TESTS" ] && echo "Backend:" && echo "$BACKEND_TESTS"
          [ -n "$FRONTEND_TESTS" ] && echo "Frontend:" && echo "$FRONTEND_TESTS"

          echo -e "\n=== Git status ==="
          git status

          # Add and commit test files
          if [[ -n $(git status -s) ]]; then
            echo -e "\n=== Adding test files ==="
            
            # Add backend tests
            [ -n "$BACKEND_TESTS" ] && find test-projects/test-backend -name "*.spec.ts" -type f -exec git add -f {} \;
            
            # Add frontend tests
            [ -n "$FRONTEND_TESTS" ] && find test-projects/test-frontend \( -name "*.test.ts" -o -name "*.test.tsx" \) -type f -exec git add -f {} \;
            
            echo -e "\n=== Committing changes ==="
            PR_BRANCH="${{ steps.pr-branch.outputs.head_branch }}"
            git commit -m "Add unit tests for ${PR_BRANCH}" || echo "Nothing new to commit"
          else
            echo -e "\n=== All changes already committed ==="
          fi

          echo -e "\n=== Final git status ==="
          git status

      - name: Push branch and update comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get committed test files
          CHANGED_FILES=$(git diff --name-only HEAD~1 2>/dev/null | grep -E "\.(spec\.ts|test\.ts|test\.tsx)$" || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            echo "No test files were changed or committed"
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/issues/comments/${{ steps.initial-comment.outputs.comment_id }}" \
              -f body="⚠️ No unit test files were generated. Possible reasons:
          - No testable code changes detected in the PR
          - Changes don't require unit tests (configs, docs, etc.)
          - Claude couldn't identify appropriate test patterns

          Review the PR changes to determine if tests are needed."
            exit 0
          fi

          echo "Changed test files:"
          echo "$CHANGED_FILES"

          # Count by type
          BACKEND_COUNT=$(echo "$CHANGED_FILES" | grep "\.spec\.ts$" | wc -l)
          FRONTEND_COUNT=$(echo "$CHANGED_FILES" | grep -E "\.(test\.ts|test\.tsx)$" | wc -l)

          # Push the branch
          echo -e "\n=== Pushing branch to remote ==="
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ steps.create-branch.outputs.branch }}

          # Create PR comparison URL
          REPO_URL="https://github.com/${{ github.repository }}"
          BRANCH_NAME="${{ steps.create-branch.outputs.branch }}"
          PR_HEAD_BRANCH="${{ steps.pr-branch.outputs.head_branch }}"
          PR_CREATE_URL="$REPO_URL/compare/$PR_HEAD_BRANCH...$BRANCH_NAME?expand=1"

          # Build summary
          SUMMARY=""
          if [ "$BACKEND_COUNT" -gt 0 ]; then
            SUMMARY="${SUMMARY}\n- **Backend**: $BACKEND_COUNT test file(s) (\`.spec.ts\`)"
          fi
          if [ "$FRONTEND_COUNT" -gt 0 ]; then
            SUMMARY="${SUMMARY}\n- **Frontend**: $FRONTEND_COUNT test file(s) (\`.test.ts\`/\`.test.tsx\`)"
          fi

          # Update comment with success
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/comments/${{ steps.initial-comment.outputs.comment_id }}" \
            -f body="✅ Unit tests have been generated and pushed to branch \`$BRANCH_NAME\`

          **Tests generated:**$SUMMARY

          **Next steps:**
          1. Review the generated tests locally:
             \`\`\`bash
             git fetch origin
             git checkout $BRANCH_NAME
             \`\`\`

          2. Run the tests to verify they work:
             - Backend: \`cd test-projects/test-backend && yarn test\`
             - Frontend: \`cd test-projects/test-frontend && yarn test\`

          3. Once reviewed and tests pass, create a PR:
             [$PR_CREATE_URL]($PR_CREATE_URL)

          <details>
          <summary>📋 View all generated test files</summary>

          \`\`\`
          $CHANGED_FILES
          \`\`\`
          </details>

          <details>
          <summary>📚 Testing guidelines</summary>

          - **Backend tests**: See [CLAUDE-BE.md](https://github.com/${{ github.repository }}/blob/main/CLAUDE-BE.md#unit-testing-guidelines)
          - **Frontend tests**: See [CLAUDE-FE.md](https://github.com/${{ github.repository }}/blob/main/CLAUDE-FE.md#unit-testing-guidelines)
          </details>"

      - name: Add completion reaction
        if: success() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Add failure reaction
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'confused'
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr-info.outputs.number }},
              body: '❌ Unit test generation failed. Please check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            });
