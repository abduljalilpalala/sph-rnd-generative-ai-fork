name: Claude Unified Unit Test Generator (Claude.md dependent)

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

jobs:
  generate-unit-tests:
    if: |
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude-create-unit-test')) ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'claude-create-unit-test')

    runs-on: [self-hosted, claude-code-review]

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Add eye reaction to acknowledge comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Get PR number
        id: pr-info
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Get PR branch info
        id: pr-branch
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ steps.pr-info.outputs.number }}
            });

            core.setOutput('head_branch', pr.data.head.ref);
            core.setOutput('base_branch', pr.data.base.ref);
            return pr.data;

      - name: Checkout repository
        uses: actions/github-script@v7
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect project type from PR changes
        id: detect-type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get changed files in the PR
          CHANGED_FILES=$(gh pr diff ${{ steps.pr-info.outputs.number }} --name-only)

          echo "Changed files in PR:"
          echo "$CHANGED_FILES"

          # Save changed files to a temporary file for Claude to analyze
          echo "$CHANGED_FILES" > /tmp/pr_changed_files.txt

          echo "Saved changed files to /tmp/pr_changed_files.txt"
          echo "Claude will analyze the project structure and determine what type of changes were made."

      - name: Post initial comment
        id: initial-comment
        uses: actions/github-script@v7
        with:
          script: |
            const type = '${{ steps.detect-type.outputs.type }}';
            let message = '';

            if (type === 'both') {
              message = '🔄 Generating unit tests for both backend and frontend changes... This may take a few minutes.';
            } else if (type === 'backend') {
              message = '🔄 Generating backend unit tests... This may take a few minutes.';
            } else if (type === 'frontend') {
              message = '🔄 Generating frontend unit tests... This may take a few minutes.';
            } else {
              message = '⚠️ No testable code changes detected. Skipping test generation.';
            }

            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr-info.outputs.number }},
              body: message
            });
            core.setOutput('comment_id', comment.id);
            return comment.id;

      - name: Create branch for unit tests
        if: steps.detect-type.outputs.type != 'none'
        id: create-branch
        run: |
          PR_BRANCH="${{ steps.pr-branch.outputs.head_branch }}"
          BRANCH_NAME="${PR_BRANCH}-unit-test"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

          # Delete the remote branch if it exists
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git --delete "$BRANCH_NAME" 2>/dev/null || echo "Branch doesn't exist remotely, continuing..."

          # Create and checkout the new branch
          git checkout -b "$BRANCH_NAME"

      - name: Generate Unit Tests with Claude
        if: steps.detect-type.outputs.type != 'none'
        id: claude-tests
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_UNIT_TEST }}
          additional_permissions: |
            actions: read
          prompt: |
            You are tasked with generating comprehensive unit tests for PR #${{ steps.pr-info.outputs.number }}.

            ## Step 1: Read Project Documentation

            **CRITICAL**: Before doing anything else, read the following files to understand the project structure and testing requirements:

            1. `cat CLAUDE.md` - Understand the overall project structure and which sub-projects exist
            2. Based on the project type detected below, read the appropriate context file(s):
               - Backend changes: `cat CLAUDE-BE.md`
               - Frontend changes: `cat CLAUDE-FE.md`
               - Both: Read both files

            These files contain ALL the information you need about:
            - Project architecture and folder structure
            - Testing frameworks and patterns to use
            - File naming conventions for test files
            - What to test and how to test it
            - Examples and best practices

            ## Step 2: Analyze PR Changes

            Run: `gh pr diff ${{ steps.pr-info.outputs.number }}`

            This will show you all the files that changed in this PR.

            ## Step 3: Generate Tests

            **Project Type Detected**: ${{ steps.detect-type.outputs.type }}

            Follow the unit testing guidelines from the CLAUDE-*.md files you read in Step 1. The documentation will tell you:
            - Which files need test files
            - Where to place test files
            - What naming convention to use
            - What testing libraries and patterns to use
            - How to structure your tests

            ## Critical Rules:

            - **Follow the documentation**: All testing requirements are in CLAUDE-BE.md and CLAUDE-FE.md
            - **DO NOT create output.txt or any summary files**
            - **DO NOT create any markdown files or documentation**
            - **ONLY create test files** (follow naming conventions from the docs)
            - **DO NOT commit the files** - just create them
            - Create tests for ALL testable files found in the PR diff
          claude_args: '--allowed-tools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(cat:*),Bash(ls:*),Bash(find:*),Bash(grep:*)" --dangerously-skip-permissions'

      - name: Debug - Check what Claude created
        if: steps.detect-type.outputs.type != 'none'
        run: |
          echo "=== Workspace contents ==="
          ls -la

          echo -e "\n=== Backend test files ==="
          find test-projects/test-backend -name "*.spec.ts" -type f 2>/dev/null || echo "No backend test files found"

          echo -e "\n=== Frontend test files ==="
          find test-projects/test-frontend -name "*.test.ts" -o -name "*.test.tsx" -type f 2>/dev/null || echo "No frontend test files found"

          echo -e "\n=== Git status ==="
          git status

          echo -e "\n=== Untracked files ==="
          git ls-files --others --exclude-standard

      - name: Check for test files and commit
        if: steps.detect-type.outputs.type != 'none'
        run: |
          echo "=== Checking for test files ==="

          # Find all test files
          ALL_TESTS=$(find test-projects -name "*.spec.ts" -o -name "*.test.ts" -o -name "*.test.tsx" -type f 2>/dev/null || echo "")

          if [ -z "$ALL_TESTS" ]; then
            echo "No test files found"
            exit 1
          fi

          echo "Found test files:"
          echo "$ALL_TESTS"

          echo -e "\n=== Git status ==="
          git status

          # Check if there are any uncommitted changes
          if [[ -n $(git status -s) ]]; then
            echo -e "\n=== Adding test files ==="
            find test-projects -name "*.spec.ts" -o -name "*.test.ts" -o -name "*.test.tsx" -type f -exec git add -f {} \;
            
            echo -e "\n=== Committing changes ==="
            PR_BRANCH="${{ steps.pr-branch.outputs.head_branch }}"
            git commit -m "${PR_BRANCH} Unit Tests" || echo "Nothing new to commit"
          else
            echo -e "\n=== All changes already committed ==="
          fi

          echo -e "\n=== Final git status ==="
          git status

      - name: Push branch and update comment
        if: steps.detect-type.outputs.type != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get only the files that were actually committed
          CHANGED_FILES=$(git diff --name-only HEAD~1 2>/dev/null | grep -E "\.(spec\.ts|test\.ts|test\.tsx)$" || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            echo "No test files were changed or committed"
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/issues/comments/${{ steps.initial-comment.outputs.comment_id }}" \
              -f body="⚠️ No unit test files were generated. This may be because the changes don't require tests or Claude couldn't identify testable code."
            exit 0
          fi

          echo "Changed test files:"
          echo "$CHANGED_FILES"

          # Count by type
          BACKEND_COUNT=$(echo "$CHANGED_FILES" | grep "\.spec\.ts$" | wc -l || echo "0")
          FRONTEND_COUNT=$(echo "$CHANGED_FILES" | grep -E "\.(test\.ts|test\.tsx)$" | wc -l || echo "0")

          echo -e "\nPushing branch to remote..."
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ steps.create-branch.outputs.branch }}

          # Create PR comparison URL
          REPO_URL="https://github.com/${{ github.repository }}"
          BRANCH_NAME="${{ steps.create-branch.outputs.branch }}"
          PR_HEAD_BRANCH="${{ steps.pr-branch.outputs.head_branch }}"
          PR_CREATE_URL="$REPO_URL/compare/$PR_HEAD_BRANCH...$BRANCH_NAME?expand=1"

          # Build summary message
          SUMMARY=""
          if [ "$BACKEND_COUNT" -gt 0 ]; then
            SUMMARY="${SUMMARY}\n- **Backend tests**: $BACKEND_COUNT file(s) (.spec.ts)"
          fi
          if [ "$FRONTEND_COUNT" -gt 0 ]; then
            SUMMARY="${SUMMARY}\n- **Frontend tests**: $FRONTEND_COUNT file(s) (.test.ts/.test.tsx)"
          fi

          # Update comment with success message
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/comments/${{ steps.initial-comment.outputs.comment_id }}" \
            -f body="✅ Unit tests have been generated and pushed to branch \`$BRANCH_NAME\`

          **Tests generated:**$SUMMARY

          **Next steps:**
          1. Review the generated tests locally:
             \`\`\`bash
             git fetch origin
             git checkout $BRANCH_NAME
             \`\`\`

          2. Once reviewed, create a PR using this link:
             $PR_CREATE_URL

          <details>
          <summary>View all changed files</summary>

          \`\`\`
          $CHANGED_FILES
          \`\`\`
          </details>"

      - name: Handle no testable changes
        if: steps.detect-type.outputs.type == 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "No testable code changes detected in this PR"
          exit 0

      - name: Add completion reaction
        if: success() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            })

      - name: Add failure reaction
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'confused'
            })
