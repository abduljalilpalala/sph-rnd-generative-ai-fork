name: Claude Unit Test Generator

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

jobs:
  generate-unit-tests:
    if: |
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude-create-unit-test')) ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'claude-create-unit-test')

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Add eye reaction to acknowledge comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      - name: Get PR number
        id: pr-info
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Post initial comment
        id: initial-comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr-info.outputs.number }},
              body: '🔄 Generating unit tests for this PR... This may take a few minutes.'
            });
            core.setOutput('comment_id', comment.id);
            return comment.id;

      - name: Create branch for unit tests
        id: create-branch
        run: |
          BRANCH_NAME="unit-tests/pr-${{ steps.pr-info.outputs.number }}-$(date +%s)"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          git checkout -b "$BRANCH_NAME"

      - name: Generate Unit Tests with Claude
        id: claude-tests
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          prompt: |
            Generate comprehensive unit tests for the changes in PR #${{ steps.pr-info.outputs.number }}.

            IMPORTANT: This is a NestJS/TypeScript project. Follow these rules:

            1. First, run `gh pr diff ${{ steps.pr-info.outputs.number }}` to see all file changes

            2. For EVERY .ts file that is a controller (.controller.ts) or service (.service.ts):
               - Create a corresponding .spec.ts file in the SAME directory
               - Example: src/user/user.controller.ts → create src/user/user.controller.spec.ts
               - Example: src/user/user.service.ts → create src/user/user.service.spec.ts

            3. Test file requirements:
               - Use Jest and NestJS testing utilities (@nestjs/testing)
               - Mock all dependencies (services, repositories, Prisma)
               - Test all public methods
               - Cover success cases, error cases, and edge cases
               - Follow NestJS testing patterns

            4. For each test file:
               - Import necessary testing modules (Test, TestingModule from @nestjs/testing)
               - Create proper mocks for injected dependencies
               - Test controller endpoints (GET, POST, PUT, DELETE)
               - Test service business logic
               - Mock Prisma client if used

            5. Check if similar .spec.ts files exist in the project to match the style

            6. After creating all test files, commit with: "Add unit tests for PR #${{ steps.pr-info.outputs.number }}"

            DO NOT skip creating tests. Create a .spec.ts file for EVERY .controller.ts and .service.ts file in the PR diff.
          claude_args: '--allowed-tools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(cat:*),Bash(ls:*),Bash(find:*),Bash(grep:*)" --dangerously-skip-permissions'

      - name: Push branch and create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if there are changes to commit
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "Add unit tests for PR #${{ steps.pr-info.outputs.number }}" || true
            
            # Push to the base repository (not the fork)
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ steps.create-branch.outputs.branch }}
            
            # Create PR and capture the URL
            PR_URL=$(gh pr create \
              --title "Unit Tests for PR #${{ steps.pr-info.outputs.number }}" \
              --body "This PR adds unit tests for the changes in #${{ steps.pr-info.outputs.number }}.

            Generated by Claude Code in response to @claude-create-unit-test comment.
            
            Related PR: #${{ steps.pr-info.outputs.number }}" \
              --base ${{ github.event.repository.default_branch }} \
              --head ${{ steps.create-branch.outputs.branch }})
            
            # Update the initial comment with success message
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/issues/comments/${{ steps.initial-comment.outputs.comment_id }}" \
              -f body="✅ Unit tests have been generated and submitted in a new PR: $PR_URL

            Please review the test coverage and merge when ready."
          else
            echo "No test files were created"
            # Update the initial comment with warning message
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/issues/comments/${{ steps.initial-comment.outputs.comment_id }}" \
              -f body="⚠️ No unit test files were generated. This may be because the changes don't require tests or Claude couldn't identify testable code."
          fi

      - name: Add completion reaction
        if: success() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            })

      - name: Add failure reaction
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'confused'
            })
