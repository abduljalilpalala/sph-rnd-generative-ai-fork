name: Claude Unified Unit Test Generator v3

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

jobs:
  generate-unit-tests:
    if: |
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude-create-unit-test')) ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'claude-create-unit-test')

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Add eye reaction to acknowledge comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Get PR number
        id: pr-info
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Get PR branch info
        id: pr-branch
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ steps.pr-info.outputs.number }}
            });

            core.setOutput('head_branch', pr.data.head.ref);
            core.setOutput('base_branch', pr.data.base.ref);
            return pr.data;

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Post initial comment
        id: initial-comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr-info.outputs.number }},
              body: '🔄 Analyzing PR changes and generating unit tests... This may take a few minutes.'
            });
            core.setOutput('comment_id', comment.id);
            return comment.id;

      - name: Pre-flight check - Verify docs exist
        run: |
          echo "=== Checking for documentation files ==="

          if [ ! -f "CLAUDE.md" ]; then
            echo "⚠️  WARNING: CLAUDE.md not found in repository root"
          else
            echo "✅ CLAUDE.md found"
          fi

          if [ ! -f "CLAUDE-BE.md" ]; then
            echo "⚠️  WARNING: CLAUDE-BE.md not found"
          else
            echo "✅ CLAUDE-BE.md found"
          fi

          if [ ! -f "CLAUDE-FE.md" ]; then
            echo "⚠️  WARNING: CLAUDE-FE.md not found"
          else
            echo "✅ CLAUDE-FE.md found"
          fi

      - name: Create branch for unit tests
        id: create-branch
        run: |
          PR_BRANCH="${{ steps.pr-branch.outputs.head_branch }}"
          BRANCH_NAME="${PR_BRANCH}-unit-test"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

          # Delete the remote branch if it exists
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git --delete "$BRANCH_NAME" 2>/dev/null || echo "Branch doesn't exist remotely, continuing..."

          # Create and checkout the new branch
          git checkout -b "$BRANCH_NAME"

      - name: Generate Unit Tests with Claude
        id: claude-tests
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          additional_permissions: |
            actions: read
          prompt: |
            Generate comprehensive unit tests for PR #${{ steps.pr-info.outputs.number }}.

            STEP 1 - READ DOCUMENTATION:
            ```bash
            cat CLAUDE.md
            cat CLAUDE-BE.md
            cat CLAUDE-FE.md
            ```

            STEP 2 - ANALYZE PR CHANGES:
            ```bash
            gh pr diff ${{ steps.pr-info.outputs.number }}
            ```

            STEP 3 - IDENTIFY FILES THAT NEED TESTS:

            From the PR diff, identify files that need tests:

            **Backend files (test-projects/test-backend/src/):**
            - ✅ Include: .controller.ts files (e.g., user.controller.ts)
            - ✅ Include: .service.ts files (e.g., user.service.ts)
            - ❌ Exclude: .dto.ts files (DTOs don't need unit tests)
            - ❌ Exclude: .entity.ts files (entities don't need unit tests)
            - ❌ Exclude: .module.ts files (modules don't need unit tests)
            - ❌ Exclude: files in node_modules/

            **Frontend files (test-projects/test-frontend/):**
            - ✅ Include: Component .tsx files in components/ directory
            - ✅ Include: Hook files (use*.ts) in hooks/ directory
            - ✅ Include: Utility .ts files in lib/ directory (except configs)
            - ❌ Exclude: Page files in app/ directory
            - ❌ Exclude: Config files (.config.ts, .config.js)
            - ❌ Exclude: Type definition files (.d.ts)
            - ❌ Exclude: files in node_modules/

            STEP 4 - CREATE TEST FILES:

            For each identified file, create a test file IN THE SAME DIRECTORY:

            Backend examples:
            - src/user/user.controller.ts → src/user/user.controller.spec.ts
            - src/product/product.service.ts → src/product/product.service.spec.ts

            Frontend examples:
            - components/atoms/Button.tsx → components/atoms/Button.test.tsx
            - hooks/useUsers.ts → hooks/useUsers.test.ts

            Follow the patterns in CLAUDE-BE.md and CLAUDE-FE.md exactly.

            CRITICAL RULES:
            - ✅ DO: Create tests only in test-projects/ directories
            - ✅ DO: Follow naming conventions (.spec.ts or .test.ts/.test.tsx)
            - ✅ DO: Use patterns from documentation
            - ❌ DO NOT: Create any files in node_modules/
            - ❌ DO NOT: Create tests for DTOs, entities, modules, configs
            - ❌ DO NOT: Create output.txt or markdown files
            - ❌ DO NOT: Commit files

            Start by reading the docs and PR diff.
          claude_args: '--allowed-tools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(cat:*),Bash(ls:*),Bash(find:*),Bash(grep:*)" --dangerously-skip-permissions'

      - name: Debug - Check what Claude created
        if: always()
        run: |
          echo "=== All new TypeScript test files (excluding node_modules) ==="
          find test-projects -type f \( -name "*.spec.ts" -o -name "*.test.ts" -o -name "*.test.tsx" \) \
            -not -path "*/node_modules/*" 2>/dev/null || echo "No test files found"

          echo -e "\n=== Files in node_modules (should be empty) ==="
          find test-projects -type f \( -name "*.spec.ts" -o -name "*.test.ts" -o -name "*.test.tsx" \) \
            -path "*/node_modules/*" 2>/dev/null || echo "✅ No test files in node_modules"

          echo -e "\n=== Git status ==="
          git status

      - name: Clean up any files in node_modules
        run: |
          echo "=== Removing any test files accidentally created in node_modules ==="
          find test-projects -type f \( -name "*.spec.ts" -o -name "*.test.ts" -o -name "*.test.tsx" \) \
            -path "*/node_modules/*" -delete 2>/dev/null || echo "No files to clean"

          echo "=== Verifying cleanup ==="
          REMAINING=$(find test-projects -type f \( -name "*.spec.ts" -o -name "*.test.ts" -o -name "*.test.tsx" \) \
            -path "*/node_modules/*" 2>/dev/null | wc -l)

          if [ "$REMAINING" -gt 0 ]; then
            echo "⚠️ Warning: $REMAINING test files still in node_modules"
          else
            echo "✅ All test files outside node_modules"
          fi

      - name: Check for test files and commit
        id: commit-tests
        continue-on-error: true
        run: |
          echo "=== Checking for valid test files (excluding node_modules) ==="

          # Find test files, excluding node_modules
          BACKEND_TESTS=$(find test-projects/test-backend/src -type f -name "*.spec.ts" \
            -not -path "*/node_modules/*" 2>/dev/null || echo "")

          FRONTEND_TESTS=$(find test-projects/test-frontend -type f \( -name "*.test.ts" -o -name "*.test.tsx" \) \
            -not -path "*/node_modules/*" \
            -not -path "*/app/*" 2>/dev/null || echo "")

          ALL_TESTS="${BACKEND_TESTS}${FRONTEND_TESTS}"

          if [ -z "$ALL_TESTS" ]; then
            echo "No valid test files found"
            echo "tests_found=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "tests_found=true" >> $GITHUB_OUTPUT
          echo "Found test files:"
          [ -n "$BACKEND_TESTS" ] && echo "Backend:" && echo "$BACKEND_TESTS"
          [ -n "$FRONTEND_TESTS" ] && echo "Frontend:" && echo "$FRONTEND_TESTS"

          # Add and commit test files (excluding node_modules)
          if [[ -n $(git status -s) ]]; then
            echo -e "\n=== Adding test files ==="
            
            # Add backend tests (excluding node_modules)
            if [ -n "$BACKEND_TESTS" ]; then
              find test-projects/test-backend/src -type f -name "*.spec.ts" \
                -not -path "*/node_modules/*" -exec git add -f {} \;
            fi
            
            # Add frontend tests (excluding node_modules and app/)
            if [ -n "$FRONTEND_TESTS" ]; then
              find test-projects/test-frontend -type f \( -name "*.test.ts" -o -name "*.test.tsx" \) \
                -not -path "*/node_modules/*" \
                -not -path "*/app/*" -exec git add -f {} \;
            fi
            
            echo -e "\n=== Committing changes ==="
            PR_BRANCH="${{ steps.pr-branch.outputs.head_branch }}"
            git commit -m "Add unit tests for ${PR_BRANCH}" || echo "Nothing new to commit"
          fi

          echo -e "\n=== Final git status ==="
          git status

      - name: Push branch and update comment (Success)
        if: steps.commit-tests.outputs.tests_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get committed test files
          CHANGED_FILES=$(git diff --name-only HEAD~1 2>/dev/null | grep -E "\.(spec\.ts|test\.ts|test\.tsx)$" || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            echo "No test files were committed"
            exit 1
          fi

          # Count by type
          BACKEND_COUNT=$(echo "$CHANGED_FILES" | grep "\.spec\.ts$" | wc -l)
          FRONTEND_COUNT=$(echo "$CHANGED_FILES" | grep -E "\.(test\.ts|test\.tsx)$" | wc -l)

          # Push the branch
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ steps.create-branch.outputs.branch }}

          # Create PR comparison URL
          REPO_URL="https://github.com/${{ github.repository }}"
          BRANCH_NAME="${{ steps.create-branch.outputs.branch }}"
          PR_HEAD_BRANCH="${{ steps.pr-branch.outputs.head_branch }}"
          PR_CREATE_URL="$REPO_URL/compare/$PR_HEAD_BRANCH...$BRANCH_NAME?expand=1"

          # Build summary
          SUMMARY=""
          if [ "$BACKEND_COUNT" -gt 0 ]; then
            SUMMARY="${SUMMARY}\n- **Backend**: $BACKEND_COUNT test file(s) (\`.spec.ts\`)"
          fi
          if [ "$FRONTEND_COUNT" -gt 0 ]; then
            SUMMARY="${SUMMARY}\n- **Frontend**: $FRONTEND_COUNT test file(s) (\`.test.ts\`/\`.test.tsx\`)"
          fi

          # Update comment with success
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/comments/${{ steps.initial-comment.outputs.comment_id }}" \
            -f body="✅ Unit tests have been generated and pushed to branch \`$BRANCH_NAME\`

          **Tests generated:**$SUMMARY

          **Next steps:**
          1. Review the generated tests locally:
             \`\`\`bash
             git fetch origin
             git checkout $BRANCH_NAME
             \`\`\`

          2. Run the tests to verify they work:
             - Backend: \`cd test-projects/test-backend && yarn test\`
             - Frontend: \`cd test-projects/test-frontend && yarn test\`

          3. Once reviewed and tests pass, create a PR:
             [$PR_CREATE_URL]($PR_CREATE_URL)

          <details>
          <summary>📋 View all generated test files</summary>

          \`\`\`
          $CHANGED_FILES
          \`\`\`
          </details>

          <details>
          <summary>📚 Testing guidelines</summary>

          - **Backend tests**: See [CLAUDE-BE.md](https://github.com/${{ github.repository }}/blob/main/CLAUDE-BE.md#unit-testing-guidelines)
          - **Frontend tests**: See [CLAUDE-FE.md](https://github.com/${{ github.repository }}/blob/main/CLAUDE-FE.md#unit-testing-guidelines)
          </details>"

      - name: Update comment (No tests generated)
        if: steps.commit-tests.outputs.tests_found != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED_FILES=$(gh pr diff ${{ steps.pr-info.outputs.number }} --name-only)

          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/comments/${{ steps.initial-comment.outputs.comment_id }}" \
            -f body="⚠️ No unit test files were generated.

          **Possible reasons:**
          - No testable code changes (only DTOs, configs, or docs changed)
          - Changes are in excluded directories (node_modules, app/ pages)
          - Documentation files may be missing

          **Changed files in PR:**
          \`\`\`
          $CHANGED_FILES
          \`\`\`

          **Note:** We don't generate tests for:
          - DTOs (.dto.ts files)
          - Entities (.entity.ts)
          - Modules (.module.ts)
          - Config files
          - Page components (app/ directory)
          - Files in node_modules/"

      - name: Add completion reaction
        if: success() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Add failure reaction
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'confused'
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr-info.outputs.number }},
              body: '❌ Unit test generation workflow failed. Please check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.\n\n**Common issues:**\n- Missing ANTHROPIC_API_KEY secret\n- Missing documentation files (CLAUDE.md, CLAUDE-BE.md, CLAUDE-FE.md)\n- Insufficient GitHub permissions'
            });
