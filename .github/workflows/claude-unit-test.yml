name: Framework Agnostic Claude Unit Test Generator v1

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

jobs:
  generate-unit-tests:
    if: |
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude-create-unit-test')) ||
      (github.event_name == 'pull_request' &&
      github.event.label.name == 'claude-create-unit-test')

    runs-on: [self-hosted, claude-code-review]

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Add eye reaction to acknowledge comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Get PR number
        id: pr-info
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Post initial comment
        id: initial-comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr-info.outputs.number }},
              body: '🔄 Generating unit tests for this PR... This may take a few minutes.'
            });
            core.setOutput('comment_id', comment.id);

      - name: Detect Framework and Load Instructions
        id: load-instructions
        run: |
          TEMPLATE_REPO="https://raw.githubusercontent.com/ragg09-sunasterisk/rnd-unit-test-templates/main"
          INSTRUCTIONS=""
          FRAMEWORK="unknown"
          USE_CLAUDE_MD=false

          echo "📋 Checking for project-specific unit test instructions..."

          if [ -f "claude.md" ]; then
            echo "✓ Found claude.md in project"
            if grep -qi "unit.*test\|test.*instruction\|testing.*guide" claude.md; then
              echo "✓ Found unit test instructions in claude.md"
              INSTRUCTIONS=$(cat claude.md)
              USE_CLAUDE_MD=true

              EXTRACTED_FRAMEWORK=$(grep -iE "framework:\s*(\w+)|this is a (\w+) (project|application)" claude.md | head -1 | grep -oE "(nestjs|nextjs|react|express|laravel|rails|vue|django|flask|fastapi|angular|svelte|remix|astro|solid|qwik|nuxt)" | tr '[:upper:]' '[:lower:]' || echo "")

              if [ -n "$EXTRACTED_FRAMEWORK" ]; then
                FRAMEWORK="$EXTRACTED_FRAMEWORK"
                echo "✓ Extracted framework from claude.md: $FRAMEWORK"
              else
                FRAMEWORK="custom"
                echo "→ Using custom instructions from claude.md (no specific framework detected)"
              fi
            else
              echo "⚠ claude.md exists but doesn't contain unit test instructions"
            fi
          fi

          if [ -z "$INSTRUCTIONS" ] || [ "$USE_CLAUDE_MD" = false ]; then
            echo "📦 Detecting framework from project structure..."

            # === Framework Auto-Detection ===
            if [ -f "nest-cli.json" ] || grep -q "@nestjs/core" package.json 2>/dev/null; then FRAMEWORK="nestjs"
            elif grep -q "\"next\":" package.json 2>/dev/null || [ -f "next.config.js" ] || [ -f "next.config.ts" ] || [ -f "next.config.mjs" ]; then FRAMEWORK="nextjs"
            elif [ -f "nuxt.config.js" ] || [ -f "nuxt.config.ts" ] || grep -q "\"nuxt\":" package.json 2>/dev/null; then FRAMEWORK="nuxt"
            elif grep -q "\"react\":" package.json 2>/dev/null; then FRAMEWORK="react"
            elif [ -f "artisan" ] && grep -q "laravel/framework" composer.json 2>/dev/null; then FRAMEWORK="laravel"
            elif grep -q "flask" requirements.txt 2>/dev/null; then FRAMEWORK="flask"
            else FRAMEWORK="generic"
            fi

            echo "📥 Fetching instructions for '$FRAMEWORK'..."
            INSTRUCTIONS_URL="$TEMPLATE_REPO/$FRAMEWORK/instructions.md"
            HTTP_CODE=$(curl -s -o /tmp/fetched-instructions.txt -w "%{http_code}" "$INSTRUCTIONS_URL")

            if [ "$HTTP_CODE" = "200" ] && [ -s /tmp/fetched-instructions.txt ]; then
              INSTRUCTIONS=$(cat /tmp/fetched-instructions.txt)
              echo "✓ Successfully fetched instructions for $FRAMEWORK"
            else
              echo "⚠ Could not fetch instructions, using generic template"
              INSTRUCTIONS="Generate comprehensive unit tests for all modified files in this PR."
              FRAMEWORK="generic"
            fi
          fi

          echo "$INSTRUCTIONS" > /tmp/test-instructions.txt
          echo "framework=$FRAMEWORK" >> $GITHUB_OUTPUT
          echo "use_claude_md=$USE_CLAUDE_MD" >> $GITHUB_OUTPUT
          echo "✅ Instructions loaded successfully for framework: $FRAMEWORK"

      - name: Create branch for unit tests
        id: create-branch
        run: |
          BRANCH_NAME="unit-tests/pr-${{ steps.pr-info.outputs.number }}-$(date +%s)"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          git checkout -b "$BRANCH_NAME"

      - name: Generate Unit Tests with Claude
        id: claude-tests
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          prompt: |
            Generate comprehensive unit tests for the changes in PR #${{ steps.pr-info.outputs.number }}.

            **Detected Framework:** ${{ steps.load-instructions.outputs.framework }}

            ## Instructions
            $(cat /tmp/test-instructions.txt)

            Follow the framework-specific conventions and ensure comprehensive coverage.

          claude_args: '--allowed-tools "Bash(gh pr diff:*),Bash(cat:*),Bash(ls:*),Bash(grep:*)" --dangerously-skip-permissions'

      - name: Push branch and create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "Add unit tests for PR #${{ steps.pr-info.outputs.number }}" || true
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ steps.create-branch.outputs.branch }}

            PR_URL=$(gh pr create \
              --title "Unit Tests for PR #${{ steps.pr-info.outputs.number }}" \
              --body "This PR adds unit tests for the changes in #${{ steps.pr-info.outputs.number }}.

            **Framework Detected:** ${{ steps.load-instructions.outputs.framework }}

            Generated by Claude Code." \
              --base ${{ github.event.repository.default_branch }} \
              --head ${{ steps.create-branch.outputs.branch }})

            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/issues/comments/${{ steps.initial-comment.outputs.comment_id }}" \
              -f body="✅ Unit tests have been generated and submitted in a new PR: $PR_URL
            **Framework:** ${{ steps.load-instructions.outputs.framework }}"
          else
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/issues/comments/${{ steps.initial-comment.outputs.comment_id }}" \
              -f body="⚠️ No unit test files were generated. This may be because the changes don't require tests."
          fi

      - name: Add completion reaction
        if: success() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Add failure reaction
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'confused'
            });
