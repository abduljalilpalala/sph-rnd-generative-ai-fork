name: Claude Code Review (v2)

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

jobs:
  claude-review:
    if: |
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude-review')) ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'claude-review')

    runs-on: [self-hosted, claude-code-review]
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Add eye reaction to acknowledge comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Set PR number
        id: pr-number
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Code Review (TODO + Final)
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          additional_permissions: |
            actions: read
          prompt: |
            Review PR #${{ steps.pr-number.outputs.number }} thoroughly.

            Format your **final output** exactly like this:

            ## 🧩 Overview
            - Brief summary of what this PR does

            ## 💪 Strengths
            - Highlight good code patterns or architecture decisions

            ## ⚠️ Issues
            - List found bugs, risks, or inconsistencies
            - Skip purely stylistic issues covered by our linter

            ## 💡 Recommendations
            - Provide concrete improvement ideas or code snippets:
              ```ts
              // Example code suggestion
              if (!user?.id) throw new Error("User not found");
              ```

            ## 🧾 Verdict
            - ✅ Approved / 🛠️ Needs Revision
            - Confidence level, maintainability, and test coverage impression

            ---
            **Guidelines:**
            - CLAUDE.md adherence is mandatory.
            - Maintain identical section titles & order across all PRs.
            - Only include new or changed findings in subsequent runs.
            - Respect linter configurations (ESLint, PHP-CS-Fixer, etc.).
            - Use concise and professional tone throughout.

          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
