name: Claude Code Review (v2 - With GitHub MCP)

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

jobs:
  claude-review:
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude-review')) ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'claude-review')

    runs-on: [self-hosted, claude-code-review]

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Add eye reaction to acknowledge comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Set PR number
        id: pr-number
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Environment Debug Info
        run: |
          echo "================================================"
          echo "ENVIRONMENT INFORMATION"
          echo "================================================"
          echo "Runner: self-hosted"
          echo "PR Number: ${{ steps.pr-number.outputs.number }}"
          echo "Repository: ${{ github.repository }}"
          echo "GitHub Token Available: ${{ secrets.GITHUB_TOKEN != '' }}"
          echo "Anthropic API Key Available: ${{ secrets.ANTHROPIC_API_KEY_CODE_REVIEW != '' }}"
          echo ""
          echo "Testing connectivity..."
          curl -I https://api.anthropic.com 2>&1 | head -3 || echo "Cannot reach Anthropic"
          curl -I https://api.github.com 2>&1 | head -3 || echo "Cannot reach GitHub"
          echo "================================================"

      - name: Run Claude Code Review with GitHub MCP Tools
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIONS_RUNNER_DEBUG: true
          ACTIONS_STEP_DEBUG: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_CODE_REVIEW }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          additional_permissions: |
            actions: read
            pull_requests: write
            issues: write
          claude_args: |
            --allowedTools "mcp__github__get_pull_request,
                            mcp__github__get_pull_request_files,
                            mcp__github__get_pull_request_diff,
                            mcp__github__create_pending_pull_request_review,
                            mcp__github__add_comment_to_pending_review,
                            mcp__github__submit_pending_pull_request_review,
                            mcp__github_inline_comment__create_inline_comment,
                            mcp__github__create_and_submit_pull_request_review,
                            mcp__github__add_issue_comment,
                            mcp__github__get_pull_request_comments,
                            mcp__github__get_pull_request_reviews,
                            mcp__github__resolve_pull_request_conversation,
                            mcp__github__create_issue_comment"
          prompt: |
            Review PR #${{ steps.pr-number.outputs.number }} in repository ${{ github.repository }}.

            **INSTRUCTIONS:**

            1. Use the GitHub MCP tools to read the PR details, files, and diff
            2. Perform a comprehensive code review following CLAUDE.md guidelines
            3. Post your review comment with this EXACT format using `mcp__github__add_issue_comment`:

            ## 🧩 Overview
            - Brief summary of what this PR does

            ## 💪 Strengths
            - Highlight good code patterns or architecture decisions

            ## ⚠️ Issues
            - List found bugs, risks, or inconsistencies
            - Skip purely stylistic issues covered by our linter

            ## 💡 Recommendations
            - Provide concrete improvement ideas or code snippets

            ## 🧾 Verdict
            - [✅ Approved OR 🛠️ Needs Revision]
            - Confidence level, maintainability, and test coverage impression

            4. **CRITICAL: Use GitHub MCP tools to submit an official review:**
               - If your verdict is "✅ Approved", use `mcp__github__create_and_submit_pull_request_review` with event="APPROVE"
               - If your verdict is "🛠️ Needs Revision", use `mcp__github__create_and_submit_pull_request_review` with event="REQUEST_CHANGES"
               - Include a link to your detailed comment in the review body

            5. **CRITICAL: Create a file called `verdict.txt` in the working directory containing ONLY:**
               - The word `approved` if your verdict is "✅ Approved"
               - The word `needs_revision` if your verdict is "🛠️ Needs Revision"

            **Example verdict.txt contents:**
            ```
            needs_revision
            ```

            Do NOT include any other text in this file - just the single word.
            Do NOT commit verdict.txt to the current branch - it should only exist in the action's working directory.

            **IMPORTANT:** You have access to GitHub MCP tools. Please use them to:
            - Read the PR (`mcp__github__get_pull_request`)
            - Get files (`mcp__github__get_pull_request_files`)
            - Get diff (`mcp__github__get_pull_request_diff`)
            - Submit your review (`mcp__github__create_and_submit_pull_request_review`)

      - name: Check Claude Code Action Outputs
        run: |
          echo "================================================"
          echo "CLAUDE CODE ACTION OUTPUTS"
          echo "================================================"
          echo "Checking for verdict.txt..."
          if [ -f verdict.txt ]; then
            echo "✅ verdict.txt found"
            echo "Contents: $(cat verdict.txt)"
          else
            echo "❌ verdict.txt not found"
          fi
          echo "================================================"

      - name: Read Claude's Verdict
        id: read-verdict
        run: |
          if [ -f verdict.txt ]; then
            VERDICT=$(cat verdict.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
            echo "verdict=$VERDICT" >> $GITHUB_OUTPUT
            echo "Found verdict: $VERDICT"
          else
            echo "verdict=unknown" >> $GITHUB_OUTPUT
            echo "⚠️ verdict.txt not found"
          fi

      - name: Check if Claude Submitted Review via MCP
        id: check-review
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr-number.outputs.number }};

            console.log('================================================');
            console.log('CHECKING FOR CLAUDE[BOT] REVIEW');
            console.log('================================================');

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            console.log(`Total reviews found: ${reviews.length}`);

            // Check for claude[bot] reviews
            const claudeBotReviews = reviews.filter(r => r.user.login === 'claude[bot]');
            console.log(`Reviews from claude[bot]: ${claudeBotReviews.length}`);

            if (claudeBotReviews.length > 0) {
              console.log('✅✅✅ SUCCESS! CLAUDE[BOT] SUBMITTED A REVIEW! ✅✅✅');
              const latestReview = claudeBotReviews[claudeBotReviews.length - 1];
              console.log(`  State: ${latestReview.state}`);
              console.log(`  Body: ${latestReview.body?.substring(0, 200)}...`);
              console.log(`  Submitted: ${latestReview.submitted_at}`);
              core.setOutput('claude_reviewed', 'true');
              core.setOutput('review_state', latestReview.state);
            } else {
              console.log('❌ No reviews from claude[bot] found');
              console.log('MCP tools may not have been used or failed');
              core.setOutput('claude_reviewed', 'false');
            }

            // Show all review authors
            console.log('');
            console.log('All review authors:');
            const uniqueAuthors = [...new Set(reviews.map(r => r.user.login))];
            uniqueAuthors.forEach(author => {
              const count = reviews.filter(r => r.user.login === author).length;
              console.log(`  ${author}: ${count} review(s)`);
            });

            console.log('================================================');

      - name: Add Labels Based on Verdict
        if: steps.read-verdict.outputs.verdict != 'unknown'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr-number.outputs.number }};
            const verdict = '${{ steps.read-verdict.outputs.verdict }}';

            console.log(`Managing labels for verdict: ${verdict}`);

            if (verdict === 'approved') {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: 'Claude Requests Changes'
                });
                console.log('Removed "Claude Requests Changes" label');
              } catch (error) {
                console.log('Label not found or already removed');
              }
              
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['Claude Code Approved']
              });
              console.log('✅ Added "Claude Code Approved" label');
              
            } else if (verdict === 'needs_revision') {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: 'Claude Code Approved'
                });
                console.log('Removed "Claude Code Approved" label');
              } catch (error) {
                console.log('Label not found or already removed');
              }
              
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['Claude Requests Changes']
              });
              console.log('✅ Added "Claude Requests Changes" label');
            }

      - name: Fallback - Submit Review via GitHub Actions (if Claude didn't)
        if: |
          steps.check-review.outputs.claude_reviewed != 'true' &&
          steps.read-verdict.outputs.verdict != 'unknown'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr-number.outputs.number }};
            const verdict = '${{ steps.read-verdict.outputs.verdict }}';

            console.log('⚠️ Claude did not submit a review via MCP');
            console.log('⚠️ Falling back to github-actions[bot] review submission');

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            // Get Claude's comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });

            const claudeComment = comments.reverse().find(comment => 
              comment.user.login === 'claude[bot]' && 
              comment.body.includes('## 🧩 Overview')
            );

            let reviewBody = '';
            let event = '';

            if (verdict === 'approved') {
              event = 'APPROVE';
              reviewBody = claudeComment 
                ? `### ✅ Approved by Claude Code review\n\n[📋 **View detailed review →**](${claudeComment.html_url})`
                : '✅ **Approved by Claude Code review.**';
                
              // Dismiss previous REQUEST_CHANGES if exists
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              
              const requestChangesReview = reviews.reverse().find(review =>
                review.user.login === 'github-actions[bot]' &&
                review.state === 'CHANGES_REQUESTED'
              );
              
              if (requestChangesReview) {
                await github.rest.pulls.dismissReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  review_id: requestChangesReview.id,
                  message: 'Claude has approved the changes.'
                });
                console.log('Dismissed previous REQUEST_CHANGES review');
              }
              
            } else if (verdict === 'needs_revision') {
              event = 'REQUEST_CHANGES';
              reviewBody = claudeComment
                ? `### 🤖 Changes requested by Claude Code review\n\n[📋 **View detailed review →**](${claudeComment.html_url})`
                : '🤖 **Changes requested by Claude Code review.**';
                
              // Dismiss previous APPROVE if exists
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              
              const approveReview = reviews.reverse().find(review =>
                review.user.login === 'github-actions[bot]' &&
                review.state === 'APPROVED'
              );
              
              if (approveReview) {
                await github.rest.pulls.dismissReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  review_id: approveReview.id,
                  message: 'Claude has identified issues that need to be addressed.'
                });
                console.log('Dismissed previous APPROVE review');
              }
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              commit_id: pr.head.sha,
              event: event,
              body: reviewBody
            });
            console.log(`✅ Created ${event} review via github-actions[bot]`);

      - name: Final Summary
        if: always()
        run: |
          echo "================================================"
          echo "FINAL SUMMARY"
          echo "================================================"
          echo "PR Number: ${{ steps.pr-number.outputs.number }}"
          echo "Verdict: ${{ steps.read-verdict.outputs.verdict }}"
          echo "Claude Reviewed: ${{ steps.check-review.outputs.claude_reviewed }}"
          echo ""
          if [ "${{ steps.check-review.outputs.claude_reviewed }}" == "true" ]; then
            echo "✅✅✅ SUCCESS! ✅✅✅"
            echo "Claude submitted the review using MCP tools!"
            echo "Review author: claude[bot]"
            echo "Review state: ${{ steps.check-review.outputs.review_state }}"
          else
            echo "⚠️ Claude did not use MCP tools to submit review"
            echo "Fallback: github-actions[bot] submitted the review"
          fi
          echo "================================================"

      - name: Add completion reaction
        if: success() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Add failure reaction
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'confused'
            });
