name: Claude Code Review

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

jobs:
  claude-review:
    if: |
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude-review')) ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'claude-review')

    runs-on: [self-hosted, claude-code-review]
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Add eye reaction to acknowledge comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Set PR number
        id: pr-number
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Load linter config
        id: linter-config
        run: |
          # Extract linter rules and output as escaped JSON for Claude's context
          if [ -f ".eslintrc.json" ] || [ -f ".eslintrc.js" ] || [ -f "eslint.config.js" ]; then
            LINTER_INFO=$(cat .eslintrc.* 2>/dev/null | head -50)
            echo "config<<EOF" >> $GITHUB_OUTPUT
            echo "$LINTER_INFO" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "config=No linter config found" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          prompt: |
            Review PR #${{ steps.pr-number.outputs.number }} and provide a comprehensive code review.

            IMPORTANT: Follow this EXACT structure for your review output:

            ## 📋 Overview
            Brief summary of what this PR does and files changed.

            ## ✅ Strengths
            List positive aspects (good practices, design patterns, test coverage, etc).

            ## ⚠️ Issues Found
            Categorize issues by severity:
            ### Critical
            - Issue 1 with file:line reference and code suggestion

            ### High
            - Issue 1 with file:line reference and code suggestion

            ### Medium
            - Issue 1 with file:line reference and code suggestion

            ### Low
            - Issue 1 with file:line reference and code suggestion

            ## 💡 Recommendations
            Actionable suggestions to improve the code (include code snippets where helpful).

            ## 🎯 Verdict
            Overall assessment: [APPROVE | APPROVE_WITH_NOTES | REQUEST_CHANGES]
            Summary: One sentence conclusion.

            ---

            LINTER CONTEXT (respect these rules - do not suggest conflicting changes):
            ${{ steps.linter-config.outputs.config }}

            REVIEW GUIDELINES:
            1. Only flag issues that are ACTUALLY present in the diff
            2. Respect the project's linter configuration - do not suggest changes that conflict with it
            3. Focus on: code quality, security, performance, testing, maintainability
            4. Provide specific file:line references and code snippets for each issue
            5. Include concrete code suggestions for issues whenever possible
            6. Be constructive and professional

            Commands available:
            - Use `gh pr diff` to view the complete diff
            - Use `gh pr view` to see PR metadata
            - Use `gh pr comment` to post or edit comments

          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

      - name: Add success reaction
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const event = context.payload;
            const commentId = event.comment?.id || null;
            const issueNumber = event.issue?.number || event.pull_request?.number;

            if (commentId) {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                content: '+1'
              });
            }

      - name: Add error reaction on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const event = context.payload;
            const commentId = event.comment?.id || null;

            if (commentId) {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                content: 'confused'
              });
            }
