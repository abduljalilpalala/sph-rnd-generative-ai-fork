name: Claude Code Review (v2)

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

jobs:
  claude-review:
    if: |
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude-review')) ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'claude-review')

    runs-on: [self-hosted, claude-code-review]
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Add eye reaction to acknowledge comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Set PR number
        id: pr-number
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Code Review with MCP
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          additional_permissions: |
            actions: read
          prompt: |
            You are reviewing PR #${{ steps.pr-number.outputs.number }} in ${{ github.repository }}.

            IMPORTANT: You have full permission to use ALL mcp__github__* tools. Do NOT say you lack permissions.

            ═══════════════════════════════════════════════════════════
            STEP 1: FETCH PR INFORMATION (REQUIRED)
            ═══════════════════════════════════════════════════════════
            Execute these tool calls NOW:

            a) Call mcp__github__get_pull_request with:
            {
              "owner": "${{ github.repository_owner }}",
              "repo": "${{ github.event.repository.name }}",
              "pull_number": ${{ steps.pr-number.outputs.number }}
            }

            b) Call mcp__github__get_pull_request_diff with:
            {
              "owner": "${{ github.repository_owner }}",
              "repo": "${{ github.event.repository.name }}",
              "pull_number": ${{ steps.pr-number.outputs.number }}
            }

            ═══════════════════════════════════════════════════════════
            STEP 2: ANALYZE CODE (REQUIRED)
            ═══════════════════════════════════════════════════════════
            Review guidelines:
            - CLAUDE.md adherence is mandatory
            - Check for bugs, security issues, and best practices
            - Respect linter configurations
            - Skip purely stylistic issues

            Determine: ✅ Approved OR 🛠️ Needs Revision

            ═══════════════════════════════════════════════════════════
            STEP 3: POST REVIEW COMMENT (REQUIRED)
            ═══════════════════════════════════════════════════════════
            Call mcp__github__add_issue_comment with:
            {
              "owner": "${{ github.repository_owner }}",
              "repo": "${{ github.event.repository.name }}",
              "issue_number": ${{ steps.pr-number.outputs.number }},
              "body": "[your review in this format]"
            }

            Review format:
            ## 🧩 Overview
            - Brief summary

            ## 💪 Strengths
            - Highlight good code patterns or architecture decisions

            ## ⚠️ Issues
            - List found bugs, risks, or inconsistencies
            - Skip purely stylistic issues covered by our linter

            ## 💡 Recommendations
            - Improvements

            ## 🧾 Verdict
            - ✅ Approved OR 🛠️ Needs Revision
            - Confidence, maintainability, test coverage

            ═══════════════════════════════════════════════════════════
            STEP 4A: IF APPROVED - EXECUTE THESE EXACT TOOL CALLS
            ═══════════════════════════════════════════════════════════
            If verdict is "✅ Approved", execute IN THIS EXACT ORDER:

            Tool call 1 - Call mcp__github__add_labels:
            {
              "owner": "${{ github.repository_owner }}",
              "repo": "${{ github.event.repository.name }}",
              "issue_number": ${{ steps.pr-number.outputs.number }},
              "labels": ["Claude Code Approved"]
            }

            Tool call 2 - Call mcp__github__remove_label:
            {
              "owner": "${{ github.repository_owner }}",
              "repo": "${{ github.event.repository.name }}",
              "issue_number": ${{ steps.pr-number.outputs.number }},
              "name": "Claude Requests Changes"
            }
            (If this returns 404, that's OK - label didn't exist)

            ═══════════════════════════════════════════════════════════
            STEP 4B: IF NEEDS REVISION - EXECUTE THESE EXACT TOOL CALLS
            ═══════════════════════════════════════════════════════════
            If verdict is "🛠️ Needs Revision", execute IN THIS EXACT ORDER:

            Tool call 1 - Call mcp__github__add_labels:
            {
              "owner": "${{ github.repository_owner }}",
              "repo": "${{ github.event.repository.name }}",
              "issue_number": ${{ steps.pr-number.outputs.number }},
              "labels": ["Claude Requests Changes"]
            }

            Tool call 2 - Call mcp__github__remove_label:
            {
              "owner": "${{ github.repository_owner }}",
              "repo": "${{ github.event.repository.name }}",
              "issue_number": ${{ steps.pr-number.outputs.number }},
              "name": "Claude Code Approved"
            }
            (If this returns 404, that's OK - label didn't exist)

            Tool call 3 - Call mcp__github__create_and_submit_pull_request_review:
            {
              "owner": "${{ github.repository_owner }}",
              "repo": "${{ github.event.repository.name }}",
              "pull_number": ${{ steps.pr-number.outputs.number }},
              "event": "REQUEST_CHANGES",
              "body": "Changes requested. Please review the detailed feedback in the comments above."
            }

            ═══════════════════════════════════════════════════════════
            MANDATORY REQUIREMENTS - NO EXCEPTIONS
            ═══════════════════════════════════════════════════════════
            1. You MUST execute the tool calls in STEP 4A or 4B
            2. Do NOT describe what you would do - ACTUALLY DO IT
            3. Do NOT say you lack permissions - YOU HAVE PERMISSIONS
            4. Do NOT use bash/gh CLI commands - USE MCP TOOLS ONLY
            5. Do NOT add inline comments - ONE summary comment only
            6. After executing, confirm: "✅ Label '[label name]' applied successfully"
            7. If any tool fails, report the EXACT error message

          # Enable GitHub MCP tools via allowed tools format (compatible with Claude Code 2.0.25)
          claude_args: |
            --allowedTools "mcp__github__get_pull_request,mcp__github__get_pull_request_files,mcp__github__get_pull_request_diff,mcp__github__add_issue_comment,mcp__github__create_issue_comment,mcp__github__add_labels,mcp__github__remove_label,mcp__github__create_and_submit_pull_request_review"

      - name: Add completion reaction
        if: success() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Add failure reaction
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'confused'
            });
