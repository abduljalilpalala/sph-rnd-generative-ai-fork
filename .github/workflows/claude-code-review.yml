name: Claude Code Review (v2)

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

jobs:
  claude-review:
    if: |
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude-review')) ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'claude-review')

    runs-on: [self-hosted, claude-code-review]
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Add eye reaction to acknowledge comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Set PR number
        id: pr-number
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Code Review (Standardized)
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          prompt: |
            Review PR #${{ steps.pr-number.outputs.number }} thoroughly.

            🧭 **Objective:**
            Conduct a standardized, structured, and consistent review following our internal CLAUDE.md guidelines and linting rules.

            📘 **Format your final review in this exact structure:**

            ---
            ## 🧩 Overview
            - Briefly summarize what this PR changes or introduces.

            ## 💪 Strengths
            - Highlight well-implemented parts, readability, clean structure, or good practices observed.

            ## ⚠️ Issues
            - List problems, bugs, potential regressions, or inconsistencies.
            - Align findings with our current linter configuration (don’t flag style/lint issues already covered by tools).

            ## 💡 Recommendations
            - Provide clear, actionable improvement steps.
            - Include inline code suggestions **where possible** (triple backticks).
            - Prioritize improvements based on impact: Critical → Important → Nice-to-have.

            ## 🧾 Verdict
            - Conclude with overall quality rating (✅ Approved / 🛠️ Needs Revision).
            - Summarize confidence level, test coverage impression, and maintainability.

            ---
            📏 **Important Notes:**
            - Maintain the exact section order and headings above.
            - Keep your tone constructive and professional.
            - Avoid redundancy between runs; only post new or updated findings based on changes.
            - Respect and align with our current project linters (ESLint, PHP-CS-Fixer, etc.).
            - Suggest code improvements inline where appropriate to reduce iteration cycles.

          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
