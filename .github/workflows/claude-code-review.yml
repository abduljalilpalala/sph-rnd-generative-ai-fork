name: Claude Code Review (v2)

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

jobs:
  claude-review:
    if: |
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude-review')) ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'claude-review')

    runs-on: [self-hosted, claude-code-review]
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Add eye reaction to acknowledge comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Set PR number
        id: pr-number
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Code Review with MCP
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          additional_permissions: |
            actions: read
          prompt: |
            Review PR #${{ steps.pr-number.outputs.number }} thoroughly using GitHub MCP tools.

            **IMPORTANT INSTRUCTIONS:**

            1. First, fetch the PR details and diff:
               - Use mcp__github__get_pull_request to get PR info
               - Use mcp__github__get_pull_request_diff to see all changes

            2. Perform your code review following these guidelines:
               - CLAUDE.md adherence is mandatory
               - Check for bugs, security issues, and best practices
               - Respect linter configurations (ESLint, PHP-CS-Fixer, etc.)
               - Skip purely stylistic issues covered by linters

            3. Post your review comment using mcp__github__add_issue_comment with this format:

            ## 🧩 Overview
            - Brief summary of what this PR does

            ## 💪 Strengths
            - Highlight good code patterns or architecture decisions

            ## ⚠️ Issues
            - List found bugs, risks, or inconsistencies
            - Skip purely stylistic issues covered by our linter

            ## 💡 Recommendations
            - Provide concrete improvement ideas or code snippets:
              ```ts
              // Example code suggestion
              if (!user?.id) throw new Error("User not found");
              ```

            ## 🧾 Verdict
            - ✅ Approved / 🛠️ Needs Revision
            - Confidence level, maintainability, and test coverage impression

            4. **Based on your verdict, perform the following actions:**

            **IF APPROVED (✅ Approved):**
            - Use mcp__github__add_labels to add the label "Claude Code Approved" to PR #${{ steps.pr-number.outputs.number }}
            - Use mcp__github__remove_label to remove "Claude Requests Changes" if it exists (may not exist, that's okay)

            **IF NEEDS REVISION (🛠️ Needs Revision):**
            - Use mcp__github__add_labels to add the label "Claude Requests Changes" to PR #${{ steps.pr-number.outputs.number }}
            - Use mcp__github__remove_label to remove "Claude Code Approved" if it exists (may not exist, that's okay)
            - Use mcp__github__create_and_submit_pull_request_review with event="REQUEST_CHANGES" to create an official review request
            - In the review body, include a summary of the key issues from your ⚠️ Issues section
            - If there are specific file/line issues, use mcp__github_inline_comment__create_inline_comment to add inline comments on the problematic code

            5. **CRITICAL:** Make sure to actually call the MCP tools to add/remove labels and create reviews. Don't just mention doing it - actually execute the tool calls.

            ---
            **Remember:**
            - Use MCP tools to interact with GitHub (don't just describe what should happen)
            - Maintain identical section titles & order across all PRs
            - Only include new or changed findings in subsequent runs
            - Use concise and professional tone throughout

          claude_args: |
            --allowed-tools "mcp__github__get_pull_request,
                            mcp__github__get_pull_request_files,
                            mcp__github__get_pull_request_diff,
                            mcp__github__create_pending_pull_request_review,
                            mcp__github__add_comment_to_pending_review,
                            mcp__github__submit_pending_pull_request_review,
                            mcp__github_inline_comment__create_inline_comment,
                            mcp__github__create_and_submit_pull_request_review,
                            mcp__github__add_issue_comment,
                            mcp__github__get_pull_request_comments,
                            mcp__github__get_pull_request_reviews,
                            mcp__github__create_issue_comment,
                            mcp__github__add_labels,
                            mcp__github__remove_label"

      - name: Add completion reaction
        if: success() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Add failure reaction
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'confused'
            });
