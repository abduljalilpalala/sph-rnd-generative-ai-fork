name: Claude Code Review (v2)

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

jobs:
  claude-review:
    if: |
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude-review')) ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'claude-review')

    runs-on: [self-hosted, claude-code-review]
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Add eye reaction to acknowledge comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Set PR number
        id: pr-number
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Code Review with MCP
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          additional_permissions: |
            actions: read
          prompt: |
            Review PR #${{ steps.pr-number.outputs.number }} in repository ${{ github.repository }}.

            Execute the following steps IN ORDER:

            ═══════════════════════════════════════════════════════════
            STEP 1: FETCH PR INFORMATION
            ═══════════════════════════════════════════════════════════
            1. Use mcp__github__get_pull_request to get PR details
            2. Use mcp__github__get_pull_request_diff to see all changes

            ═══════════════════════════════════════════════════════════
            STEP 2: PERFORM CODE REVIEW
            ═══════════════════════════════════════════════════════════
            Analyze the code following these guidelines:
            - CLAUDE.md adherence is mandatory
            - Check for bugs, security issues, and best practices
            - Respect linter configurations (ESLint, PHP-CS-Fixer, etc.)
            - Skip purely stylistic issues covered by linters
            - Determine verdict: ✅ Approved OR 🛠️ Needs Revision

            ═══════════════════════════════════════════════════════════
            STEP 3: POST REVIEW COMMENT
            ═══════════════════════════════════════════════════════════
            Use mcp__github__add_issue_comment to post a comprehensive review with this format:

            ## 🧩 Overview
            - Brief summary of what this PR does

            ## 💪 Strengths
            - Highlight good code patterns or architecture decisions

            ## ⚠️ Issues
            - List found bugs, risks, or inconsistencies
            - Skip purely stylistic issues covered by our linter

            ## 💡 Recommendations
            - Provide concrete improvement ideas or code snippets

            ## 🧾 Verdict
            - [✅ Approved OR 🛠️ Needs Revision]
            - Confidence level, maintainability, and test coverage impression

            ═══════════════════════════════════════════════════════════
            STEP 4: APPLY LABELS (MUST EXECUTE)
            ═══════════════════════════════════════════════════════════

            IF VERDICT IS "✅ Approved":
            1. Use mcp__github__add_labels with:
               - owner: "${{ github.repository_owner }}"
               - repo: "${{ github.event.repository.name }}"
               - issue_number: ${{ steps.pr-number.outputs.number }}
               - labels: ["Claude Code Approved"]

            2. Use mcp__github__remove_label to remove "Claude Requests Changes" (ignore if fails)

            IF VERDICT IS "🛠️ Needs Revision":
            1. Use mcp__github__add_labels with:
               - owner: "${{ github.repository_owner }}"
               - repo: "${{ github.event.repository.name }}"
               - issue_number: ${{ steps.pr-number.outputs.number }}
               - labels: ["Claude Requests Changes"]

            2. Use mcp__github__remove_label to remove "Claude Code Approved" (ignore if fails)

            3. Use mcp__github__create_and_submit_pull_request_review with:
               - owner: "${{ github.repository_owner }}"
               - repo: "${{ github.event.repository.name }}"
               - pull_number: ${{ steps.pr-number.outputs.number }}
               - event: "REQUEST_CHANGES"
               - body: "Changes requested. Please review the detailed feedback in the comments above."

            ═══════════════════════════════════════════════════════════
            CRITICAL REQUIREMENTS:
            ═══════════════════════════════════════════════════════════
            - You MUST actually CALL the mcp__github__add_labels tool
            - Do NOT use bash/gh commands - only use MCP tools
            - Do NOT add inline comments - keep all feedback in one summary
            - Report any errors if MCP tools fail

          # CRITICAL: Enable the GitHub MCP server and specify allowed tools
          claude_args: |
            --mcp-server github
            --allowed-tools "mcp__github__get_pull_request,mcp__github__get_pull_request_diff,mcp__github__add_issue_comment,mcp__github__create_issue_comment,mcp__github__add_labels,mcp__github__remove_label,mcp__github__create_and_submit_pull_request_review"

      - name: Add completion reaction
        if: success() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Add failure reaction
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'confused'
            });
