name: Claude QA Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude-qa-review:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude-qa-review')
    runs-on: [self-hosted, claude-code-review]

    steps:
      - name: Add 👀 reaction to comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Set PR number
        id: pr-number
        run: echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Clean workspace before installing
        run: |
          rm -rf node_modules package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Check if commit already reviewed
        id: commit-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/checkLatestCommit.mjs

      - name: Fetch previous comment test cases
        id: previous-test-case
        run: |
          # Always write file even if script fails
          node .github/scripts/getPreviousCases.mjs > previous.md || echo "[]" > previous.md
      
          PREV_B64=$(base64 -w 0 previous.md || echo "")
          echo "previous_b64=$PREV_B64" >> $GITHUB_OUTPUT

      - name: Get Ignored Test Cases
        id: ignored-test-cases
        run: |
          node .github/scripts/getIgnoredCases.mjs > ignored.md || echo "[]" > ignored.md
          
          IGNORED_B64=$(base64 -w 0 ignored.md || echo "")
          echo "ignored_b64=$IGNORED_B64" >> $GITHUB_OUTPUT

      - name: Detect Review Mode
        id: detect-mode
        shell: bash
        run: |
          # Read entire comment body safely (multi-line, special chars, quotes)
          COMMENT_BODY=$(cat <<'EOF'
          ${{ github.event.comment.body }}
          EOF
          )
          if echo "$COMMENT_BODY" | grep -Eiq 'testcase:\s*https:\/\/docs\.google\.com\/spreadsheets\/d\/'; then
            echo "mode=sheet" >> $GITHUB_OUTPUT
            echo "Detected: Sheet Mode"
          else
            echo "mode=inline" >> $GITHUB_OUTPUT
            echo "Detected: Inline Mode"
          fi

      # 🧩 Run the appropriate QA fetcher (inline or sheet)
      - name: Fetch QA test cases
        id: qa-sheet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MAX_INPUT_CHARS: ${{ secrets.MAX_INPUT_CHARS }}
          MAX_OUTPUT_CHARS: ${{ secrets.MAX_OUTPUT_CHARS }}
        run: |
          if [ "${{ steps.detect-mode.outputs.mode }}" = "sheet" ]; then
            echo "📄 Running Claude Sheet Review"
            node .github/scripts/claudeSheetReview.mjs > qa.md || echo "[]" > qa.md
          else
            echo "📝 Running Claude Inline Review"
            node .github/scripts/claudeInlineReview.mjs > qa.md || echo "[]" > qa.md
          fi
      
          # Ensure file exists and not empty
          if [ ! -s qa.md ]; then
            echo "[]" > qa.md
          fi
      
          # Encode file safely for GitHub output
          QA_CONTENT=$(base64 -w 0 qa.md || echo "W10=") # W10= is base64 for []
          echo "qa_b64=$QA_CONTENT" >> $GITHUB_OUTPUT

      - name: Debug event info
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "PR Number: ${{ github.event.issue.number }}"
          echo "Comment Body: '${{ github.event.comment.body }}'"
          echo "Detected Mode: ${{ steps.detect-mode.outputs.mode }}"
          echo "Branch Ref: ${{ github.ref }}"
      
      - name: Get changed files
        id: changed_files
        run: |
          # Fetch base branch commit only
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
      
          # Show only changed filenames between base and PR head
          git diff --name-only FETCH_HEAD HEAD > changed.txt
      
          echo "files<<EOF" >> $GITHUB_OUTPUT
          cat changed.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get limited diff
        id: limited_diff
        run: |
          # Fetch only the base branch commit
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
      
          # Generate the diff between base commit (FETCH_HEAD) and PR HEAD
          git diff --unified=5 FETCH_HEAD HEAD > diff.patch
      
          # Limit size
          head -c 50000 diff.patch > shortdiff.patch
      
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          cat shortdiff.patch >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Claude Test Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_QA_REVIEW }}
          track_progress: true
          prompt: |
            ## Instructions
              Follow all rules defined in `.github/prompts/claude-qa-rules.md`.

              ## Base64-encoded Context
              [Changed Files]
              ${{ steps.changed_files.outputs.files }}

              [Previous Test Cases (base64)]
              ${{ steps.previous-test-case.outputs.previous_b64 }}

              [QA Test Cases (base64)]
              ${{ steps.qa-sheet.outputs.qa_b64 }}

              [Ignored Test Cases (base64)]
              ${{ steps.ignored-test-cases.outputs.ignored_b64 }}

              Claude: Decode these only when needed. Do not decode everything automatically.

              ## Task Flow
              1. Gather test cases.
              2. Evaluate test cases following `.github/claude-rules.md`.
              3. Re-run previous test cases as needed.
              4. Run behavioral scan following `.github/claude-rules.md`.
              5. Simplify behavioral results for managers.
              6. Combine all test cases, remove duplicates.
              7. Generate summary.

              ## Git Config
              PR #: ${{ steps.pr-number.outputs.number }}
              Changed Files Summary:
              ${{ steps.changed_files.outputs.files }}

              Limited Diff:
              ${{ steps.limited_diff.outputs.diff }}
          claude_args: |
            --allowedTools "base64_decode, mcp__github__add_issue_comment"

      - name: Submit Claude Review Result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/submitClaudeReview.mjs
