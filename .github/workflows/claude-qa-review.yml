name: Claude QA Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude-qa-review:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude-qa-review')
    runs-on: [self-hosted, claude-code-review]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Set PR number
        id: pr-number
        run: echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Clean and install deps
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Check if commit already reviewed
        id: commit-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/checkLatestCommit.mjs

      ### -------------------------
      ### PREVIOUS & QA FETCHERS
      ### -------------------------

      - name: Fetch previous test cases
        id: previous-test-case
        run: |
          node .github/scripts/getPreviousCases.mjs > previous.md || echo "[]" > previous.md
          echo "previous_b64=$(base64 -w 0 previous.md)" >> $GITHUB_OUTPUT

      - name: Fetch ignored test cases
        id: ignored-test-cases
        run: |
          node .github/scripts/getIgnoredCases.mjs > ignored.md || echo "[]" > ignored.md
          echo "ignored_b64=$(base64 -w 0 ignored.md)" >> $GITHUB_OUTPUT

      - name: Detect Review Mode
        id: detect-mode
        run: |
          COMMENT_BODY="${{ github.event.comment.body }}"
          if echo "$COMMENT_BODY" | grep -Eiq 'testcase:\s*https://docs\.google\.com/'; then
            echo "mode=sheet" >> $GITHUB_OUTPUT
          else
            echo "mode=inline" >> $GITHUB_OUTPUT
          fi

      - name: Fetch QA test cases
        id: qa-sheet
        run: |
          if [ "${{ steps.detect-mode.outputs.mode }}" = "sheet" ]; then
            node .github/scripts/claudeSheetReview.mjs > qa.md || echo "[]" > qa.md
          else
            node .github/scripts/claudeInlineReview.mjs > qa.md || echo "[]" > qa.md
          fi

          echo "qa_b64=$(base64 -w 0 qa.md)" >> $GITHUB_OUTPUT

      ### -------------------------
      ### DIFF SECTION
      ### -------------------------

      - name: Get changed files
        id: changed-files
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          git diff --name-only FETCH_HEAD HEAD > changed.txt
          echo "files<<EOF" >> $GITHUB_OUTPUT
          cat changed.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get limited diff
        id: limited-diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          git diff --unified=5 FETCH_HEAD HEAD > diff.patch
          head -c 50000 diff.patch > shortdiff.patch
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          cat shortdiff.patch >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      ### -------------------------
      ### SINGLE CLAUDE RUN
      ### -------------------------
      - name: Run Claude Atomic QA Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_QA_REVIEW }}
          track_progress: false
          claude_args: |
            --allowedTools ""
          prompt: |
            You are a QA reviewer. Follow rules in `.github/prompts/claude-qa-rules.md`.

            ## Inputs
            Changed Files:
            ${{ steps.changed-files.outputs.files }}

            Previous Cases (b64):
            ${{ steps.previous-test-case.outputs.previous_b64 }}

            QA Cases (b64):
            ${{ steps.qa-sheet.outputs.qa_b64 }}

            Ignored Cases (b64):
            ${{ steps.ignored-test-cases.outputs.ignored_b64 }}

            Limited Diff (<=50k chars):
            ${{ steps.limited-diff.outputs.diff }}

            ## Required Output (IMPORTANT)
            Return ONLY valid JSON with this structure:

            {
              "summary": "<markdown summary for PR>",
              "inline_comments": [
                {
                  "path": "file path",
                  "start_line": number,
                  "end_line": number,
                  "body": "comment body in markdown"
                }
              ]
            }

            - DO NOT call any tools
            - DO NOT wrap in code blocks
            - DO NOT add explanations outside JSON

      - name: Save Claude Output
        run: echo '${{ steps.claude-review.outputs.completion }}' > claude_output.json

      ### -------------------------
      ### POST RESULTS USING NODE
      ### -------------------------
      - name: Submit Atomic Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr-number.outputs.number }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: node .github/scripts/postAtomicReview.mjs
