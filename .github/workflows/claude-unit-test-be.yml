name: Claude Unit Test Generator (NESTJS/TypeScript Back-End)

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

jobs:
  generate-unit-tests:
    if: |
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude-create-be-unit-test')) ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'claude-create-be-unit-test')

    runs-on: [self-hosted, claude-code-review]

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Add eye reaction to acknowledge comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      - name: Get PR number
        id: pr-info
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Get PR branch info
        id: pr-branch
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ steps.pr-info.outputs.number }}
            });

            core.setOutput('head_branch', pr.data.head.ref);
            core.setOutput('base_branch', pr.data.base.ref);
            return pr.data;

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Post initial comment
        id: initial-comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr-info.outputs.number }},
              body: '🔄 Generating unit tests for this PR... This may take a few minutes.'
            });
            core.setOutput('comment_id', comment.id);
            return comment.id;

      - name: Create branch for unit tests
        id: create-branch
        run: |
          # Use the PR's branch name as base
          PR_BRANCH="${{ steps.pr-branch.outputs.head_branch }}"
          BRANCH_NAME="${PR_BRANCH}-unit-test"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

          # Delete the remote branch if it exists
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git --delete "$BRANCH_NAME" 2>/dev/null || echo "Branch doesn't exist remotely, continuing..."

          # Create and checkout the new branch
          git checkout -b "$BRANCH_NAME"

      - name: Generate Unit Tests with Claude
        id: claude-tests
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_UNIT_TEST }}
          # track_progress: true #try claude tracking
          additional_permissions: |
            actions: read
          prompt: |
            Generate comprehensive unit tests for the changes in PR #${{ steps.pr-info.outputs.number }}.

            IMPORTANT: This is a NestJS/TypeScript project. Follow these rules:

            1. First, run `gh pr diff ${{ steps.pr-info.outputs.number }}` to see all file changes

            2. For EVERY .ts file that is a controller (.controller.ts) or service (.service.ts):
               - Create a corresponding .spec.ts file in the SAME directory
               - Example: src/user/user.controller.ts → create src/user/user.controller.spec.ts
               - Example: src/user/user.service.ts → create src/user/user.service.spec.ts

            3. Test file requirements:
               - Use Jest and NestJS testing utilities (@nestjs/testing)
               - Mock all dependencies (services, repositories, Prisma)
               - Test all public methods
               - Cover success cases, error cases, and edge cases
               - Follow NestJS testing patterns

            4. For each test file:
               - Import necessary testing modules (Test, TestingModule from @nestjs/testing)
               - Create proper mocks for injected dependencies
               - Test controller endpoints (GET, POST, PUT, DELETE)
               - Test service business logic
               - Mock Prisma client if used

            5. Check if similar .spec.ts files exist in the project to match the style

            CRITICAL RULES:
            - DO NOT create output.txt or any summary files
            - DO NOT create any markdown files or documentation
            - ONLY create .spec.ts test files
            - Create a .spec.ts file for EVERY .controller.ts and .service.ts file in the PR diff
            - DO NOT commit the files - just create them
          claude_args: '--allowed-tools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(cat:*),Bash(ls:*),Bash(find:*),Bash(grep:*)" --dangerously-skip-permissions'

      - name: Debug - Check what Claude created
        run: |
          echo "=== Workspace contents ==="
          ls -la

          echo -e "\n=== src/product directory ==="
          ls -la src/product/ || echo "src/product directory doesn't exist"

          echo -e "\n=== All .spec.ts files in workspace ==="
          find . -name "*.spec.ts" -type f -not -path "*/node_modules/*" || echo "No .spec.ts files found"

          echo -e "\n=== Git status ==="
          git status

          echo -e "\n=== Untracked files ==="
          git ls-files --others --exclude-standard

      - name: Check for test files and commit
        run: |
          echo "=== Checking for .spec.ts files ==="
          # Find spec files excluding node_modules and .git
          SPEC_FILES=$(find . -name "*.spec.ts" -type f -not -path "*/node_modules/*" -not -path "*/.git/*")

          if [ -z "$SPEC_FILES" ]; then
            echo "No .spec.ts files found"
            exit 1
          fi

          echo "Found spec files:"
          echo "$SPEC_FILES"

          echo -e "\n=== Git status ==="
          git status

          # Check if there are any uncommitted changes
          if [[ -n $(git status -s) ]]; then
            echo -e "\n=== Adding untracked/modified .spec.ts files ==="
            find . -name "*.spec.ts" -type f -not -path "*/node_modules/*" -not -path "*/.git/*" -exec git add -f {} \;
            
            echo -e "\n=== Committing changes ==="
            PR_BRANCH="${{ steps.pr-branch.outputs.head_branch }}"
            git commit -m "${PR_BRANCH} Unit Test" || echo "Nothing new to commit"
          else
            echo -e "\n=== All changes already committed ==="
          fi

          echo -e "\n=== Final git status ==="
          git status

      - name: Push branch (no PR creation)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get only the files that were actually committed (changed files)
          CHANGED_FILES=$(git diff --name-only HEAD~1 2>/dev/null | grep ".spec.ts" || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            echo "No test files were changed or committed"
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/issues/comments/${{ steps.initial-comment.outputs.comment_id }}" \
              -f body="⚠️ No unit test files were generated. This may be because the changes don't require tests or Claude couldn't identify testable code."
            exit 0
          fi

          echo "Changed test files:"
          echo "$CHANGED_FILES"

          echo -e "\nPushing branch to remote..."

          # Push the branch using token authentication
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ steps.create-branch.outputs.branch }}

          # Get the repository URL
          REPO_URL="https://github.com/${{ github.repository }}"
          BRANCH_NAME="${{ steps.create-branch.outputs.branch }}"
          PR_HEAD_BRANCH="${{ steps.pr-branch.outputs.head_branch }}"

          # Create comparison URL pointing to the PR's branch, not main
          PR_CREATE_URL="$REPO_URL/compare/$PR_HEAD_BRANCH...$BRANCH_NAME?expand=1"

          # Count only the changed test files
          TEST_FILE_COUNT=$(echo "$CHANGED_FILES" | wc -l)

          # Update the initial comment with success message and instructions
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/comments/${{ steps.initial-comment.outputs.comment_id }}" \
            -f body="✅ Unit tests have been generated and pushed to branch \`$BRANCH_NAME\`

          **Next steps:**
          1. Review the generated tests locally:
             \`\`\`bash
             git fetch origin
             git checkout $BRANCH_NAME
             \`\`\`

          2. Once reviewed, create a PR using this link:
             $PR_CREATE_URL

          **Files changed:** $TEST_FILE_COUNT test file(s) created

          <details>
          <summary>View changed files</summary>

          \`\`\`
          $CHANGED_FILES
          \`\`\`
          </details>"

      - name: Add completion reaction
        if: success() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            })

      - name: Add failure reaction
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'confused'
            })
