name: Self Hosted Runner Debugger

on:
  issue_comment:
    types: [created]
  workflow_dispatch: # Manual trigger also available

jobs:
  debug-github-runner:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@self-hosted-debug'))
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub-hosted runner
        run: |
          echo "=== GITHUB-HOSTED RUNNER DEBUG ==="
          echo "Runner: ubuntu-latest"
          echo ""
          echo "Node version:"
          node --version
          echo ""
          echo "NPM version:"
          npm --version
          echo ""
          echo "GitHub CLI version:"
          gh --version
          echo ""
          echo "MCP server check:"
          which mcp-server-github || echo "MCP server not in PATH"
          npm list -g | grep mcp || echo "MCP server not installed globally"
          echo ""
          echo "Environment variables:"
          env | grep -E "GITHUB|RUNNER" | sort
          echo ""
          echo "GitHub token status:"
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
          gh auth status

  debug-self-hosted-runner:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@self-hosted-debug'))
    runs-on: [self-hosted, claude-code-review]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Add eyes reaction to acknowledge
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      - name: Check self-hosted runner
        run: |
          echo "=== SELF-HOSTED RUNNER DEBUG ==="
          echo "Runner: self-hosted"
          echo ""
          echo "OS Info:"
          uname -a
          cat /etc/os-release | grep -E "^(NAME|VERSION)="
          echo ""
          echo "Current user:"
          whoami
          echo ""
          echo "Home directory:"
          echo $HOME
          echo ""
          echo "PATH:"
          echo $PATH
          echo ""
          echo "Node version:"
          node --version || echo "Node not found"
          echo ""
          echo "NPM version:"
          npm --version || echo "NPM not found"
          echo ""
          echo "GitHub CLI version:"
          gh --version || echo "GitHub CLI not found"
          echo ""
          echo "MCP server location:"
          which mcp-server-github || echo "MCP server not in PATH"
          echo ""
          echo "MCP server version:"
          mcp-server-github --version 2>&1 || echo "Cannot execute MCP server"
          echo ""
          echo "Global NPM packages:"
          npm list -g --depth=0 2>&1 | head -20
          echo ""
          echo "Check for MCP packages:"
          npm list -g | grep mcp || echo "No MCP packages found"
          echo ""
          echo "Environment variables:"
          env | grep -E "GITHUB|RUNNER|NODE|NPM" | sort
          echo ""
          echo "GitHub token check:"
          if [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "✅ GITHUB_TOKEN is available"
            echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token 2>&1
            gh auth status 2>&1
          else
            echo "❌ GITHUB_TOKEN is NOT available"
          fi
          echo ""
          echo "Test MCP server with token:"
          export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          export GITHUB_OWNER="${{ github.repository_owner }}"
          export GITHUB_REPO="${{ github.event.repository.name }}"
          echo "Testing MCP tools list..."
          timeout 5 mcp-server-github 2>&1 || echo "MCP server test failed or timed out"

  test-claude-action:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@self-hosted-debug'))
    runs-on: [self-hosted, claude-code-review]
    needs: debug-self-hosted-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test minimal Claude action
        uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Just respond with "Hello! MCP is working." and list available GitHub MCP tools.
          claude_args: |
            --allowedTools "mcp__github__get_pull_request"

  compare-results:
    runs-on: ubuntu-latest
    needs: [debug-github-runner, debug-self-hosted-runner]
    if: always()
    steps:
      - name: Post debug summary comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `## 🔍 Debug MCP Setup - Results\n\n` +
              `The debug workflow has completed. [View detailed logs here](${runUrl})\n\n` +
              `### What was checked:\n` +
              `- ✅ GitHub-hosted runner configuration\n` +
              `- ✅ Self-hosted runner configuration\n` +
              `- ✅ MCP server installation\n` +
              `- ✅ GitHub CLI authentication\n` +
              `- ✅ Environment variables\n` +
              `- ✅ Claude action test\n\n` +
              `Please review the logs to identify any configuration issues.`;

            if (context.payload.issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: body
              });
            }

      - name: Summary
        run: |
          echo "=== COMPARISON SUMMARY ==="
          echo "Check the logs above to compare:"
          echo "1. GitHub-hosted runner configuration"
          echo "2. Self-hosted runner configuration"
          echo "3. Look for differences in:"
          echo "   - Node/NPM versions"
          echo "   - MCP server installation"
          echo "   - Environment variables"
          echo "   - GitHub CLI authentication"
