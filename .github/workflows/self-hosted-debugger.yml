name: Claude Review Actions

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude-review:
    if: |
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '@claude-approve') ||
       contains(github.event.comment.body, '@claude-disapprove'))
    runs-on: ubuntu-latest
    steps:
      - name: Add reaction to comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body
            const reaction = body.includes('@claude-approve') ? 'thumbsup' : 'thumbsdown'
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: reaction
            })

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set PR number
        id: pr-number
        run: echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Debug info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "PR #: ${{ github.event.issue.number }}"
          echo "Comment: '${{ github.event.comment.body }}'"

      - name: Run Claude Review Action
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are Claude, acting as an **AI Code Reviewer Manager**.

            ## Task
            Depending on the command in the PR comment:
            - If comment contains `@claude-approve`, **approve the pull request**.
            - If comment contains `@claude-disapprove`, **request changes**.

            Use the following mapping:
            | Command | Event Type | Review Body |
            |----------|-------------|--------------|
            | @claude-approve | APPROVE | ✅ Approved by Claude AI (Manual Approve Request) |
            | @claude-disapprove | REQUEST_CHANGES | 🚫 Changes required by Claude AI (Manual Disapprove Request) |

            ## Logic
            1. Detect which command triggered this workflow.
            2. Submit a PR review using the MCP tool `mcp__github__create_and_submit_pull_request_review`.
            3. Include the proper event type and review body from the table above.

            ## Rules
            - Do not post extra comments.
            - Do not perform any code analysis.
            - If no valid command is found, post a short issue comment explaining the valid commands.

          claude_args: |
            --allowedTools "mcp__github__create_and_submit_pull_request_review,
                            mcp__github__get_pull_request,
                            mcp__github__add_issue_comment"
