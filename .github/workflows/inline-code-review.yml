name: Inline Code Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  inline-code-review:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@inline-code-review')
    runs-on: [self-hosted, claude-code-review]
    # runs-on: ubuntu-latest
    steps:
      - name: Add 👀 reaction to comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      - name: Set PR number
        id: pr-number
        run: echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Debug event info
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "PR Number: ${{ github.event.issue.number }}"
          echo "Comment Body: '${{ github.event.comment.body }}'"
          echo "Branch Ref: ${{ github.ref }}"
          echo "GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}"


      - name: Debug Environment
        run: |
          echo "GitHub context:"
          echo "Actor: $GITHUB_ACTOR"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Runner: $RUNNER_NAME"
          echo "Token available: ${{ secrets.GITHUB_TOKEN != '' }}"
          gh auth status || echo "Not logged in"
          gh --version
          pwd
          ls -la

      - name: Add Claude Code Review Label
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number(process.env.PR_NUMBER);

            // Make sure we are using the octokit client from github-script
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: ["Code Review: Claude Code"]
            });
        env:
          PR_NUMBER: ${{ steps.pr-number.outputs.number }}

