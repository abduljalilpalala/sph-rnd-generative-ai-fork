name: Inline Code Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  inline-code-review:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@inline-code-review')
    # runs-on: [self-hosted, claude-code-review]
    runs-on: ubuntu-latest
    steps:
      - name: Add 👀 reaction to comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      - name: Set PR number
        id: pr-number
        run: echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Check GitHub Token Scope
        run: |
          echo "Checking token permissions..."
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/repos/${{ github.repository }} > repo_info.json
          cat repo_info.json

      - name: Debug event info
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "PR Number: ${{ github.event.issue.number }}"
          echo "Comment Body: '${{ github.event.comment.body }}'"
          echo "Branch Ref: ${{ github.ref }}"
          echo "GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}"


      - name: Debug Environment
        run: |
          echo "GitHub context:"
          echo "Actor: $GITHUB_ACTOR"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Runner: $RUNNER_NAME"
          echo "Token available: ${{ secrets.GITHUB_TOKEN != '' }}"
          gh auth status || echo "Not logged in"
          gh --version
          pwd
          ls -la

      - name: Add Claude Code Review Label
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number(process.env.PR_NUMBER);

            // Make sure we are using the octokit client from github-script
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: ["Code Review: Claude Code"]
            });
        env:
          PR_NUMBER: ${{ steps.pr-number.outputs.number }}

      - name: Checkout PR branch
        uses: actions/checkout@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.ref }}
          fetch-depth: 1

      # - name: Load CLAUDE.md context
      #   id: claude-context
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     if [ -f CLAUDE.md ]; then
      #       echo "context<<EOF" >> $GITHUB_OUTPUT
      #       cat CLAUDE.md >> $GITHUB_OUTPUT
      #       echo "EOF" >> $GITHUB_OUTPUT
      #     else
      #       echo "context=CLAUDE.md not found." >> $GITHUB_OUTPUT
      #     fi

      # - name: Fetch base branch
      #   run: |
      #     git fetch origin ${{ github.event.pull_request.base.ref }}


      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GH_AJ_CLI_TOKEN }}" | gh auth login --with-token

      - name: Run Claude Inline Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_INLINE_CODE_REVIEW }}
          # track_progress: true
          prompt: |
            Task:
            1. Retrieve the latest comment from PR #${{ steps.pr-number.outputs.number }}.
            2. Copy its content exactly.
            3. Submit that same text as a new comment to the same PR.

            CONTEXT:
            PR #: ${{ steps.pr-number.outputs.number }}
            Repository: ${{ github.repository }}
            Owner: ${{ github.repository_owner }}

          claude_args: |
            --allowedTools "mcp__github__get_pull_request,
                            mcp__github__get_issue_comments,
                            mcp__github__comment_on_pull_request,
                            mcp__github__get_pull_request_files,
                            mcp__github__get_pull_request_diff,
                            mcp__github__create_pending_pull_request_review,
                            mcp__github__add_comment_to_pending_review,
                            mcp__github__submit_pending_pull_request_review,
                            mcp__github_inline_comment__create_inline_comment,
                            mcp__github__add_issue_comment,
                            mcp__github__get_pull_request_comments,
                            mcp__github__get_pull_request_reviews,
                            mcp__github__resolve_pull_request_conversation,
                            mcp__github__create_issue_comment"
