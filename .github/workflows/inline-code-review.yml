name: Inline Code Review

on:
  workflow_dispatch:   # allow manual trigger
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

jobs:
  inline-code-review:
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'inline-code-review') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@inline-code-review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Debug event info
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "PR Number (pull_request): ${{ github.event.pull_request.number || 'N/A' }}"
          echo "PR Number (issue_comment): ${{ github.event.issue.number || 'N/A' }}"
          echo "Comment Body: '${{ github.event.comment.body || 'N/A' }}'"
          echo "Branch Ref: ${{ github.ref }}"
          echo "Head Ref (PR): ${{ github.event.pull_request.head.ref || 'N/A' }}"

      - name: Add 👀 reaction (only for comments)
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })
      - name: Set PR number
        id: pr-number
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Checkout repository (issue_comment)
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 1

      - name: Checkout repository (pull_request)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Claude PR review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          prompt: |
            Please review this pull request and provide **inline comments** similar to a human GitHub reviewer.

            Steps:
            1. Start a pending review.
            2. Use the diff to identify issues, improvements, or potential bugs.
            3. Add **inline comments** anchored to specific lines in the diff.
            4. Submit the review as a **"Commented"** review (not "Approved" or "Changes Requested").

            Focus on:
            - Readability and maintainability
            - Potential bugs or missing null checks
            - Code consistency and style
            - Unused variables or redundant logic

            Do **not** summarize; only add inline comments where relevant.

          allowed_tools: >
            mcp__github__create_pending_pull_request_review,
            mcp__github__add_pull_request_review_comment_to_pending_review,
            mcp__github__submit_pending_pull_request_review,
            mcp__github__get_pull_request_diff
