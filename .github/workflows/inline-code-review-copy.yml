name: Claude Inline Code Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  inline-code-review:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude-inline-code-review')
    runs-on: [self-hosted, claude-code-review]
    steps:
      - name: Add 👀 reaction to comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      # - name: Setup MCP GitHub Server
      #   run: |
      #     npm install -g @modelcontextprotocol/server-github

      - name: Debug MCP GitHub Access
        run: |
          echo "=== Checking MCP CLI version ==="
          mcp --version || echo "MCP not installed"

          echo "=== Checking MCP GitHub authentication ==="
          mcp github status || echo "MCP not authenticated"

          echo "=== Test fetching PR info ==="
          mcp__github__get_pull_request 57 || echo "Failed to fetch PR"

          echo "=== Test listing PR files ==="
          mcp__github__get_pull_request_files 57 || echo "Failed to fetch PR files"

          echo "=== Test posting a dry-run comment ==="
          mcp__github__add_issue_comment 57 "Test comment from workflow (dry-run)" || echo "Failed to add comment"

      - name: Set PR number
        id: pr-number
        run: echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Add Claude Code Review Label
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number(process.env.PR_NUMBER);

            // Make sure we are using the octokit client from github-script
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: ["Code Review: Claude Code"]
            });
        env:
          PR_NUMBER: ${{ steps.pr-number.outputs.number }}

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 1

      - name: Load CLAUDE.md context
        id: claude-context
        run: |
          if [ -f CLAUDE.md ]; then
            echo "context<<EOF" >> $GITHUB_OUTPUT
            cat CLAUDE.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "context=CLAUDE.md not found." >> $GITHUB_OUTPUT
          fi

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_INLINE_CODE_REVIEW }}
          track_progress: true
          prompt: |
      
            🧩 What to Do (run in order)
            1. Read the PR diff and CLAUDE.md.
            2. Retrieve all past PR comments and PR reviews.
            3. Start a pending pull request review.
            4. Analyze the diff according to project conventions.
            5. For each issue found:
               - Check if a similar unresolved comment already exists.
                 * If unresolved → re-comment or clarify.
                 * If resolved → skip re-commenting.
               - Otherwise → post a new inline comment with clear, actionable feedback.
            6. Submit the review and post a summary comment following the Review Summary Rules.
      
            ---
      
            SYSTEM INSTRUCTION (do not output):
      
            [Code Review Guidelines]
              You are reviewing this as a **Code Reviewer**.  
              Your goal is to ensure the pull request follows project conventions, maintains logic integrity, and upholds readability and maintainability.
      
              ### 🔍 Focus Areas
              - Logical or runtime errors that break flow.
              - Missing validation, error handling, or edge case checks.
              - Data integrity or business logic issues.
              - Regressions or unintentional behavior changes.
              - Security and performance issues.
              - Code readability and maintainability aligned with project conventions.
      
              ### 🚫 Avoid
              - Minor code style or formatting comments.
              - Nitpicks about naming or TypeScript-specific patterns.
              - Generic comments not directly related to functionality or stability.
      
              ### ✅ Instead, focus on
              - Code correctness, clarity, and consistency.
              - Potential breakages in integrations or dependent functions.
              - Opportunities to simplify complex or redundant logic.
            [/Code Review Guidelines]
      
            [Inline Comment Format]
              **Issue:** <short, specific title>  
              **Suggested Fix:**  
              ```suggestion
                // Minimal, relevant code fix only
              ```
              **Explanation:** <Explain how this fix improves correctness, clarity, or maintainability.>
            [/Inline Comment Format]
      
            [Inline Comment Rules]
              - Add inline comments only for actionable and meaningful issues.
              - Avoid duplicates of unresolved comments.
              - Do not comment on unchanged lines.
              - Prefer inline code suggestions whenever possible for easier adoption.
            [/Inline Comment Rules]
      
            [Review Summary Rules]
              After posting inline comments, submit a single summary comment.
      
              The summary must:
              1. Tag the PR assignee or creator.
              2. Summarize how many inline comments were posted.
              3. Mention the general feedback categories (logic, structure, readability, etc.).
              4. Provide clear next steps for the developer.
              5. End with an encouraging note.
      
              ### 🧩 Example Summaries
      
              **If Requesting Changes:**
              "Hey @${{ steps.pr-meta.outputs.assignee }},
      
              I've completed reviewing this PR and found **{{n}}** items that need updates before approval.
      
              **Summary of Feedback:**
              - Fix data flow issues in controller logic  
              - Align validation with schema definitions  
              - Simplify redundant service functions  
      
              Once you've addressed these points, please push the updates and re-request a review.  
              Great work overall—almost there!"
      
              **If Approving:**
              "Hey @${{ steps.pr-meta.outputs.assignee }},
      
              I've reviewed the PR and found no blocking issues.  
              Everything aligns well with project conventions and best practices.  
      
              Excellent work—this PR is **APPROVED!**"
            [/Review Summary Rules]
      
            [Git Config]
              CONTEXT:
              PR #: ${{ steps.pr-number.outputs.number }}
              Diff URL: https://github.com/${{ github.repository }}/pull/${{ steps.pr-number.outputs.number }}.diff
              Repository: ${{ github.repository }}
              Assignee/Creator: @${{ steps.pr-meta.outputs.assignee }}
            [/Git Config]
      
          claude_args: |
            --allowedTools "mcp__github__get_pull_request,
                            mcp__github__get_pull_request_files,
                            mcp__github__get_pull_request_diff,
                            mcp__github__create_pending_pull_request_review,
                            mcp__github__add_comment_to_pending_review,
                            mcp__github__submit_pending_pull_request_review,
                            mcp__github_inline_comment__create_inline_comment,
                            mcp__github__add_issue_comment,
                            mcp__github__get_pull_request_comments,
                            mcp__github__get_pull_request_reviews,
                            mcp__github__resolve_pull_request_conversation,
                            mcp__github__create_issue_comment"



