name: Claude Inline Code Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  inline-code-review:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude-inline-code-review')
    runs-on: [self-hosted, claude-code-review]
    steps:
      - name: Add 👀 reaction to comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      - name: Set PR number
        id: pr-number
        run: echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Add Claude Code Review Label
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number(process.env.PR_NUMBER);

            // Make sure we are using the octokit client from github-script
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: ["Code Review: Claude Code"]
            });
        env:
          PR_NUMBER: ${{ steps.pr-number.outputs.number }}

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 1

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Run Claude Inline Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_INLINE_CODE_REVIEW }}
          track_progress: true
          prompt: |
            Please review this pull request and provide inline feedback that is highly actionable, concise, and aligned with best practices.

            PROJECT CONTEXT:
            Below is the content of CLAUDE.md, which outlines the project architecture and conventions.
            Use it to ensure your review aligns with the intended design and coding standards.

            IMPORTANT:
              Before suggesting any inline comment:
              - Fetch all previous PR comments and reviews.
              - If an identical or similar comment already exists for the same file/line:
                  - Check whether the issue has been resolved in the latest commit.
                  - If the issue remains unresolved, you may re-comment or update the previous feedback for clarity.
                  - If the issue has been resolved, skip re-commenting.
              - If the issue is new or newly introduced, comment normally.
              - If all prior issues have been addressed and no new problems are found, clearly indicate APPROVED in the summary.

            For each issue you identify:
            - Issue: Briefly describe the problem.
            - Suggested Fix: Provide a corrected code snippet using proper syntax highlighting.
            - Explanation: Explain why the fix improves the code or better follows project standards.
            - Prefer inline code suggestions whenever possible for easier adoption.

            If the code follows best practices and no issues are found:
            - Clearly indicate an APPROVE status.
            - Optionally highlight areas that were implemented well (structure, naming, validation, etc.).

            REVIEW SUBMISSION RULES:
            - Post inline comments directly on the relevant changed lines for each identified issue.
            - Once all inline comments have been added, submit them together as a single review.
            - After submitting the inline review, create a summary comment (using a normal PR comment)
              summarizing your findings, approval status, and next steps for the developer.

            The summary comment must:
            1. Tag the PR assignee (or creator)
            2. Summarize how many inline comments were posted
            3. Mention the general feedback categories (logic, structure, readability, etc.)
            4. Provide next actions for the developer
            5. End with an encouraging or appreciative note

            EXAMPLE SUMMARIES:

            If Requesting Changes:
            "Hey @{{assignee_or_creator}},

            I've completed reviewing this PR and found {{n}} items that need updates before approval.

            Summary of Feedback:
            - Fix dependency injection issues in the Service layer
            - Align DTO validation with Prisma schema
            - Simplify redundant controller logic

            Once you've addressed these points, please push the updates and re-request a review. Great work overall—almost there!"

            If Approving:
            "Hey @{{assignee_or_creator}},

            I've reviewed the PR and found no blocking issues.
            Everything aligns well with project conventions and best practices.

            Excellent work—this PR is APPROVED!"

            CONTEXT:
            PR #: ${{ steps.pr-number.outputs.number }}
            Diff URL: https://github.com/${{ github.repository }}/pull/${{ steps.pr-number.outputs.number }}.diff
            Repository: ${{ github.repository }}
            Assignee/Creator: @${{ steps.pr-meta.outputs.assignee }}

            claude_args: |
            --allowedTools "mcp__github__get_pull_request,
                            mcp__github__get_pull_request_files,
                            mcp__github__get_pull_request_diff,
                            mcp__github__add_issue_comment,
                            mcp__github__get_pull_request_reviews,
                            mcp__github_inline_comment__create_inline_comment,
                            mcp__github__create_and_submit_pull_request_review,
                            mcp__github__create_issue_comment"
