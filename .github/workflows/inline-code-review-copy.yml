name: Claude Inline Code Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  inline-code-review:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude-inline-code-review')
    runs-on: [self-hosted, claude-code-review]
    steps:
      - name: Add 👀 reaction to comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      - name: Set PR number
        id: pr-number
        run: echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Add Claude Code Review Label
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number(process.env.PR_NUMBER);

            // Make sure we are using the octokit client from github-script
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: ["Code Review: Claude Code"]
            });
        env:
          PR_NUMBER: ${{ steps.pr-number.outputs.number }}

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 1

      - name: Load CLAUDE.md context
        id: claude-context
        run: |
          if [ -f CLAUDE.md ]; then
            echo "context<<EOF" >> $GITHUB_OUTPUT
            cat CLAUDE.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "context=CLAUDE.md not found." >> $GITHUB_OUTPUT
          fi

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_INLINE_CODE_REVIEW }}
          track_progress: true
          prompt: |
            🧩 What to Do (run in order)
            1. Read the PR diff and CLAUDE.md.
            2. Retrieve all past PR comments and PR reviews.
            3. Start a pending pull request review.
            4. Analyze the diff according to project conventions.
            5. For each issue found:
               - Check if a similar unresolved comment already exists.
                 * If unresolved → re-comment or clarify.
                 * If resolved → skip re-commenting.
               - Otherwise → post a new inline comment with clear, actionable feedback and a severity status.
            6. Submit the review and post a summary comment following the Review Summary Rules.
      
            ---
      
            SYSTEM INSTRUCTION (do not output):
      
            [Code Review Guidelines]
              You are reviewing this pull request as a **Code Reviewer**.  
              Use the **CLAUDE.md** file as the primary reference for the project’s architecture, coding conventions, and best practices.  
              Ensure the PR follows these standards, maintains logic integrity, and upholds readability and maintainability.
              Post inline comments only for relevant issues, using severity (Critical / Moderate / Minor) where appropriate.
            
              ## Project Context (from CLAUDE.md)
              ${{ steps.project-context.outputs.claude_md }}
            [/Code Review Guidelines]
      
            [Verdict Legend]
              - ✅ PASS / APPROVED — code follows conventions, no blocking issues
              - ❌ FAIL / NEEDS CHANGE — issue detected that must be fixed
              - ⚠️ WARNING / MINOR CONCERN — non-blocking issue or recommendation
            [/Verdict Legend]
      
            [Inline Comment Format]
              **Issue:** <short, specific title>  
              **Severity:** 🟥 Critical / 🟧 Moderate / 🟨 Minor    
              **Suggested Fix:**  
              ```suggestion
                // Minimal, relevant code fix only
              ```
              **Explanation:** <Explain how this fix improves correctness, clarity, or maintainability.>
            [/Inline Comment Format]
      
            [Inline Comment Rules]
              - Add inline comments only for actionable and meaningful issues.
              - Avoid duplicates of unresolved comments.
              - Do not comment on unchanged lines.
              - Prefer inline code suggestions whenever possible for easier adoption.
            [/Inline Comment Rules]
      
            [Review Summary Rules]
              After posting inline comments, submit a single summary comment.
      
              ## 📄 Claude Code Review Summary
              - Tag the PR assignee or creator.
              - Include a metrics table summarizing both verdict and severity:
      
                | **Metric** | **Severity** | **Count** |
                |:--------------------------|:--------:|:------:|
                | ✅ Approved / Passed      | -        | n |
                | ❌ Failed / Needs Change  | Critical | n |
                | ❌ Failed / Needs Change  | Moderate | n |
                | ⚠️ Minor Concern / Warning| Minor    | n |
      
              ## 💡 Feedback Highlights
              - [🟥 Critical] Short description of critical issue
              - [🟧 Moderate] Short description of moderate issue
              - [🟨 Minor] Short description of minor issue
      
              ## 🏁 Next Steps
              - Address critical issues immediately.
              - Consider moderate improvements.
              - Optional: implement minor suggestions.
      
              ## 🌟 Appreciation
              Great work overall! Once these points are addressed, the PR should be fully ready for approval.
      
              ### 🧩 Example Summary
      
              ```
              Hey @${{ steps.pr-meta.outputs.assignee }},
      
              ## 📄 Claude Code Review Summary
              | **Metric** | **Severity** | **Count** |
              |:--------------------------|:--------:|:------:|
              | ✅ Approved / Passed      | -        | 2 |
              | ❌ Failed / Needs Change  | Critical | 2 |
              | ❌ Failed / Needs Change  | Moderate | 1 |
              | ⚠️ Minor Concern / Warning| Minor    | 1 |
      
              ## 💡 Feedback Highlights
              - [🟥 Critical] Fix runtime error in controller logic  
              - [🟧 Moderate] Align validation with schema definitions  
              - [🟨 Minor] Simplify redundant service functions  
      
              ## 🏁 Next Steps
              - Address critical issues immediately.
              - Consider moderate improvements.
              - Optional: implement minor suggestions.
      
              ## 🌟 Appreciation
              Great work overall! Once these points are addressed, the PR should be fully ready for approval.
              ```
            [/Review Summary Rules]

            [Final Review Decision Logic]
              After generating all inline comments and preparing the review summary:
            
              - Always generate the review summary using the exact format specified in [Review Summary Rules].
              - This summary must always be included in the "body" field when submitting the pending PR review.
            
              - If the total number of inline comments is **0**:
                    Submit the pending review with:
                    state = "APPROVE"
                    body = <Review Summary Rules formatted summary>
            
              - If the total number of inline comments is **1 or more**:
                    Submit the pending review with:
                    state = "REQUEST_CHANGES"
                    body = <Review Summary Rules formatted summary>
            
            [/Final Review Decision Logic]
      
            [Git Config]
              CONTEXT:
              PR No.: ${{ steps.pr-number.outputs.number }}
              Diff URL: https://github.com/${{ github.repository }}/pull/${{ steps.pr-number.outputs.number }}.diff
              Repository: ${{ github.repository }}
              Assignee/Creator: @${{ steps.pr-meta.outputs.assignee }}
            [/Git Config]
      
          claude_args: |
            --allowedTools "mcp__github__get_pull_request,
                            mcp__github__get_pull_request_files,
                            mcp__github__get_pull_request_diff,
                            mcp__github__create_pending_pull_request_review,
                            mcp__github__add_comment_to_pending_review,
                            mcp__github__submit_pending_pull_request_review,
                            mcp__github_inline_comment__create_inline_comment,
                            mcp__github__add_issue_comment,
                            mcp__github__get_pull_request_comments,
                            mcp__github__get_pull_request_reviews,
                            mcp__github__resolve_pull_request_conversation,
                            mcp__github__create_issue_comment,
                            Bash(gh pr view:*),
                            Bash(gh pr review:*)"




