name: Claude Inline Code Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  inline-code-review:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude-inline-code-review')
    runs-on: [self-hosted, claude-code-review]
    steps:
      - name: Add 👀 reaction to comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      # - name: Setup MCP GitHub Server
      #   run: |
      #     npm install -g @modelcontextprotocol/server-github

      - name: Debug MCP GitHub Access
        run: |
          echo "=== Checking MCP CLI version ==="
          mcp --version || echo "MCP not installed"

          echo "=== Checking MCP GitHub authentication ==="
          mcp github status || echo "MCP not authenticated"

          echo "=== Test fetching PR info ==="
          mcp__github__get_pull_request 57 || echo "Failed to fetch PR"

          echo "=== Test listing PR files ==="
          mcp__github__get_pull_request_files 57 || echo "Failed to fetch PR files"

          echo "=== Test posting a dry-run comment ==="
          mcp__github__add_issue_comment 57 "Test comment from workflow (dry-run)" || echo "Failed to add comment"

      - name: Set PR number
        id: pr-number
        run: echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Add Claude Code Review Label
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number(process.env.PR_NUMBER);

            // Make sure we are using the octokit client from github-script
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: ["Code Review: Claude Code"]
            });
        env:
          PR_NUMBER: ${{ steps.pr-number.outputs.number }}

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 1

      - name: Load CLAUDE.md context
        id: claude-context
        run: |
          if [ -f CLAUDE.md ]; then
            echo "context<<EOF" >> $GITHUB_OUTPUT
            cat CLAUDE.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "context=CLAUDE.md not found." >> $GITHUB_OUTPUT
          fi

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Run Claude Inline Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_INLINE_CODE_REVIEW }}
          track_progress: true
  
          prompt: |
      
            🧩 What to Do (run in order)
            1. Read the PR diff and metadata.
            2. Retrieve all past PR comments and reviews.
            3. Start a pending pull request review.
            4. Analyze the diff according to project conventions.
            5. For each issue found:
               - Check if a similar unresolved comment exists.
                 * If unresolved → repeat or clarify.
               - Otherwise → post a new inline comment.
            6. Submit the pending review with summarized findings.
      
            ---
      
            SYSTEM INSTRUCTION (do not output):
      
            [Code Review Guidelines]
              You are reviewing this as a **Code Reviewer**.  
              Your goal is to analyze the code changes for correctness, maintainability, and impact on existing logic.
      
              ### 🔍 Focus Areas
              - Logical or runtime errors.
              - Missing validation or error handling.
              - Regressions that break user flow or data integrity.
              - Unhandled edge cases or inconsistencies.
              - Security, performance, or readability issues that could cause bugs later.
      
              ### 🚫 Avoid
              - Nitpicks on code style or formatting.
              - Comments about TypeScript types, DTOs, or naming conventions.
              - Generic advice (“use async/await”, “prefer const”) unless it directly prevents a bug.
      
              ### ✅ Focus instead on
              - Whether the code achieves the intended logic safely and clearly.
              - Whether external integrations or dependencies could break.
              - Whether new or modified logic introduces side effects.
            [/Code Review Guidelines]
      
            [Git Config]
              CONTEXT:
              PR #: ${{ steps.pr-number.outputs.number }}
              Diff URL: https://github.com/${{ github.repository }}/pull/${{ steps.pr-number.outputs.number }}.diff
              Repository: ${{ github.repository }}
              Assignee/Creator: @${{ steps.pr-meta.outputs.assignee }}
              Changed files:
              ${{ steps.qa-sheet.outputs.files_summary }}
            [/Git Config]
      
            [Inline Comment Format]
              **Issue:** <short title of the issue>  
              **Observation:** <Describe the logic or flow that causes the issue.>  
              **Impact:** <Explain what could break or misbehave.>  
              **Suggestion:** <Provide a clear and minimal code-level fix.>
      
              ```suggestion
                // Minimal, relevant code fix only
              ```
            [/Inline Comment Format]
      
            [Inline Comment Rules]
              - Comment only on issues that can impact correctness or stability.
              - Avoid duplicates of unresolved comments.
              - Do not comment on unchanged lines.
              - Each inline comment should correspond to one clear issue.
            [/Inline Comment Rules]
      
            [Review Summary Rules]
              The final PR comment must include these two sections only:
              1. `## 🧩 Claude Code Review Summary`
                  | **Metric** | **Count** |
                  |:--------------------------|:------:|
                  | 🧠 **Issues Found** | n |
                  | ✅ **Resolved (from past)** | n |
                  | ❌ **New Issues** | n |
      
                  latest commit: <shortened commit hash>
      
              2. `## 🧩 Detailed Review`
                  <details>
                  <summary><strong>[Issue]</strong>: <short description></summary>
      
                  **Observation:**  
                  <Describe the logic or flow that causes the issue.>
      
                  **Impact:**  
                  <Explain what could break or misbehave.>
      
                  **Suggestion:**  
                  <Provide a clear, minimal, and actionable suggestion.>
      
                  ---
                  </details>
            [/Review Summary Rules]
      
          claude_args: |
            --allowedTools "mcp__github__get_pull_request,
                            mcp__github__get_pull_request_files,
                            mcp__github__get_pull_request_diff,
                            mcp__github__create_pending_pull_request_review,
                            mcp__github__add_comment_to_pending_review,
                            mcp__github__submit_pending_pull_request_review,
                            mcp__github_inline_comment__create_inline_comment,
                            mcp__github__add_issue_comment,
                            mcp__github__get_pull_request_comments,
                            mcp__github__get_pull_request_reviews,
                            mcp__github__resolve_pull_request_conversation,
                            mcp__github__create_issue_comment"


