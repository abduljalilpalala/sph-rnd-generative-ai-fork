      #           Summary of Feedback:
      #           - <category 1>
      #           - <category 2>
      #           - <category 3>
      
      #           Once you've addressed these points, please push the updates and re-request a review. Great work overall!"
      
      #         If Approving:
      #           "Hey @{{assignee_or_creator}},
      
      #           I've reviewed the PR and found no blocking issues.
      #           Everything aligns well with project conventions and best practices.
      
      #           Excellent work—this PR is APPROVED!"
      #       [/Final Summary Comment Rules]
      
      #       [Git Config]
      #         CONTEXT:
      #         PR No.: ${{ steps.pr-number.outputs.number }}
      #         Diff URL: https://github.com/${{ github.repository }}/pull/${{ steps.pr-number.outputs.number }}.diff
      #         Repository: ${{ github.repository }}
      #         Assignee/Creator: @${{ steps.pr-meta.outputs.assignee }}
      #       [/Git Config]
      
      #     claude_args: |
      #       --allowedTools "mcp__github__get_pull_request,
      #                       mcp__github__get_pull_request_files,
      #                       mcp__github__get_pull_request_diff,
      #                       mcp__github__add_issue_comment,
      #                       mcp__github__get_pull_request_reviews,
      #                       mcp__github_inline_comment__create_inline_comment,
      #                       mcp__github__create_and_submit_pull_request_review,
      #                       mcp__github__create_issue_comment"
          prompt: |
            🧩 What to Do (run in order)
            1. Read the PR diff and CLAUDE.md.
            2. Retrieve all past PR comments and PR reviews.
            3. Start a pending pull request review.
            4. Analyze the diff according to project conventions.
            5. For each issue:
               - Check if a similar comment exists.
                 * If unresolved → include it again or clarify.
                 * If resolved → skip.
               - If new → create a new inline comment.
            6. Add inline comments ONLY on changed lines inside the diff.
            7. Submit the pending review:
                 - If issues exist → REQUEST_CHANGES.
                 - If no issues found → APPROVE.
            8. After submitting the review, post a summary PR comment using the required structure.
          
            ---
          
            SYSTEM INSTRUCTION (do not output):
          
            ## Project Context (from CLAUDE.md)
            ${{ steps.claude-context.outputs.context }}
          
            [Review Rules]
              You must evaluate all changes based on:
              - Architecture and conventions defined in CLAUDE.md
              - Code correctness, clarity, and maintainability
              - Logical and structural soundness
          
              Before posting ANY inline comment:
                - Retrieve ALL existing PR comments.
                - Retrieve ALL existing PR reviews.
                - For each detected issue:
                    1. Check for existing identical or similar comments.
                    2. If an earlier comment exists:
                         - If unresolved: you may re-comment or clarify.
                         - If resolved: do not duplicate.
                    3. If no similar comment exists: create a new inline comment.
          
              Inline Comment Format:
                Issue: <short description>
                Suggested Fix:
                ```suggestion
                // corrected code
                ```
                Explanation: <why this improves logic or aligns with conventions>
          
              Only place comments on lines that appear in the diff.
            [/Review Rules]
          
            [Approval Logic]
              If zero issues are found:
                - Approve the PR.
                - You may highlight strong points (naming, clarity, structure).
            [/Approval Logic]
          
            [Final Summary Comment Rules]
              After submitting the pending review, you must create a summary PR comment.
          
              The summary PR comment must contain ONLY:
                1. Tag the assignee/creator: @${{ steps.pr-meta.outputs.assignee }}
                2. The number of inline comments created
                3. A short list of feedback categories (logic, structure, readability, consistency, etc.)
                4. Next steps for the developer
                5. A short encouraging note
          
              Example: Requesting Changes
                "Hey @{{assignee_or_creator}},
          
                I've completed reviewing this PR and found {{n}} items that need updates before approval.
          
                Summary of Feedback:
                - <category 1>
                - <category 2>
                - <category 3>
          
                Please apply the updates and re-request a review. Great work overall!"
          
              Example: Approving
                "Hey @{{assignee_or_creator}},
          
                I've reviewed this PR and found no blocking issues.
                Everything aligns well with project conventions and best practices.
          
                Excellent work — this PR is APPROVED!"
            [/Final Summary Comment Rules]
          
            [Git Config]
              CONTEXT:
              PR No.: ${{ steps.pr-number.outputs.number }}
              Diff URL: https://github.com/${{ github.repository }}/pull/${{ steps.pr-number.outputs.number }}.diff
              Repository: ${{ github.repository }}
              Assignee/Creator: @${{ steps.pr-meta.outputs.assignee }}
            [/Git Config]


